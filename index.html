<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Shift: Cellar</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050508;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
            pointer-events: none;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 1px 1px 3px #000;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.9);
            border: 1px solid #000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 90;
        }
        #msg {
            position: absolute;
            top: 70px;
            width: 100%;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            color: #ff5555;
            text-shadow: 1px 1px 4px #000;
            pointer-events: none;
            z-index: 100;
            padding: 0 10px;
        }
        
        /* Мобильный интерфейс */
        .mobile-btn {
            position: absolute;
            z-index: 120;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: #fff;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .mobile-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }
        #btn-action { right: 25px; bottom: 110px; }
        #btn-light { right: 100px; bottom: 35px; }

        #joystick-zone {
            position: absolute;
            left: 25px;
            bottom: 35px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 120;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        #joystick-stick {
            position: absolute;
            left: 35px;
            top: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        #touch-look-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            z-index: 80;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>БАТАРЕЯ: <span id="battery">100</span>%</div>
        <div>ИНВЕНТАРЬ: <span id="item">Пусто</span></div>
        <div>ШУМ: <span id="noise">0</span> дБ</div>
    </div>
    <div id="crosshair"></div>
    <div id="msg">Найдите домкрат и сбегите через люк!</div>

    <div id="touch-look-zone"></div>
    <div id="btn-action" class="mobile-btn">E</div>
    <div id="btn-light" class="mobile-btn">🔦</div>
    <div id="joystick-zone"><div id="joystick-stick"></div></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- ИНИЦИАЛИЗА СЦЕНЫ ---
        const scene = new THREE.Scene();
        
        // Мягкий рассеянный туман (не перекрывает видимость перед лицом)
        scene.fog = new THREE.FogExp2(0x0a0c10, 0.06);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- ИГРОК И КАМЕРА ---
        const player = new THREE.Group();
        player.position.set(0, 1.6, 8);
        scene.add(player);
        player.add(camera);

        // --- ОСВЕЩЕНИЕ (УЛУЧШЕННАЯ ВИДИМОСТЬ) ---
        // 1. Мягкое общее освещение подвала (синевато-серый холодный свет)
        const ambientLight = new THREE.AmbientLight(0x2a3040, 0.8);
        scene.add(ambientLight);

        // 2. Слабый постоянный свет вокруг самого игрока (чтобы всё перед носом было видно)
        const playerLight = new THREE.PointLight(0x556688, 0.5, 6);
        playerLight.position.set(0, 0, 0);
        camera.add(playerLight);

        // 3. Основной направленный фонарик
        const flashLight = new THREE.SpotLight(0xfff5ea, 12, 18, Math.PI / 4, 0.4);
        camera.add(flashLight);
        flashLight.position.set(0, 0, 0.1);
        flashLight.target.position.set(0, 0, -1);
        camera.add(flashLight.target);

        // --- СОСТОЯНИЕ ИГРЫ ---
        let battery = 100;
        let flashlightOn = true;
        let inventory = null;
        let currentNoise = 0;
        let isGameOver = false;

        // --- ОКРУЖЕНИЕ ---
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x444a55, roughness: 0.7 });
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x222630, roughness: 0.6 });

        // Пол
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Стена
        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), wallMat);
        backWall.position.set(0, 5, -10);
        scene.add(backWall);

        // Домкрат (Яркий предмет с металлической отражаемостью)
        const jackItem = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.5, 0.5),
            new THREE.MeshStandardMaterial({ color: 0xff9900, roughness: 0.3, metalness: 0.8 })
        );
        jackItem.position.set(-3, 0.25, 0);
        jackItem.name = "jack";
        scene.add(jackItem);

        // Люк
        const hatch = new THREE.Mesh(
            new THREE.BoxGeometry(1.6, 1.6, 0.1),
            new THREE.MeshStandardMaterial({ color: 0x663311, roughness: 0.5 })
        );
        hatch.position.set(0, 1, -9.9);
        hatch.name = "hatch";
        scene.add(hatch);

        // Бабушка
        const granny = new THREE.Mesh(
            new THREE.CylinderGeometry(0.4, 0.4, 1.8),
            new THREE.MeshStandardMaterial({ color: 0xa11111, roughness: 0.5 })
        );
        granny.position.set(0, 0.9, -8);
        scene.add(granny);

        // --- СЕНСОРНОЕ УПРАВЛЕНИЕ ДЛЯ IPHONE ---
        let yaw = 0, pitch = 0;
        let lookTouchId = null;
        let lastTouchX = 0, lastTouchY = 0;

        const lookZone = document.getElementById('touch-look-zone');

        lookZone.addEventListener('touchstart', (e) => {
            for (let t of e.changedTouches) {
                if (lookTouchId === null) {
                    lookTouchId = t.identifier;
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        });

        lookZone.addEventListener('touchmove', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === lookTouchId) {
                    let dx = t.clientX - lastTouchX;
                    let dy = t.clientY - lastTouchY;
                    
                    yaw -= dx * 0.004;
                    pitch -= dy * 0.004;
                    pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                    
                    player.rotation.y = yaw;
                    camera.rotation.x = pitch;

                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        });

        const resetLookTouch = (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === lookTouchId) lookTouchId = null;
            }
        };
        lookZone.addEventListener('touchend', resetLookTouch);
        lookZone.addEventListener('touchcancel', resetLookTouch);

        // --- ДЖОЙСТИК ---
        let moveVector = { x: 0, z: 0 };
        const joyZone = document.getElementById('joystick-zone');
        const joyStick = document.getElementById('joystick-stick');

        joyZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = joyZone.getBoundingClientRect();
            const touch = e.touches[0];
            let x = touch.clientX - rect.left - 60;
            let y = touch.clientY - rect.top - 60;
            let dist = Math.hypot(x, y);
            
            if (dist > 35) {
                x = (x / dist) * 35;
                y = (y / dist) * 35;
            }
            
            joyStick.style.transform = `translate(${x}px, ${y}px)`;
            moveVector.x = x / 35;
            moveVector.z = y / 35;
        });

        const resetJoystick = () => {
            joyStick.style.transform = `translate(0px, 0px)`;
            moveVector = { x: 0, z: 0 };
        };
        joyZone.addEventListener('touchend', resetJoystick);
        joyZone.addEventListener('touchcancel', resetJoystick);

        // --- КНОПКИ ДЕЙСТВИЯ ---
        document.getElementById('btn-action').addEventListener('touchstart', (e) => {
            e.preventDefault();
            interact();
        });

        document.getElementById('btn-light').addEventListener('touchstart', (e) => {
            e.preventDefault();
            flashlightOn = !flashlightOn;
            flashLight.visible = flashlightOn && battery > 0;
        });

        // --- ЛОГИКА ВЗАИМОДЕЙСТВИЯ ---
        function interact() {
            if (isGameOver) return;
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(), camera);
            const intersects = raycaster.intersectObjects([jackItem, hatch]);

            if (intersects.length > 0 && intersects[0].distance < 3.5) {
                const obj = intersects[0].object;
                
                if (obj.name === "jack") {
                    inventory = "Домкрат";
                    document.getElementById('item').innerText = inventory;
                    scene.remove(obj);
                    document.getElementById('msg').innerText = "Вы подняли домкрат!";
                } 
                else if (obj.name === "hatch") {
                    if (inventory === "Домкрат") {
                        currentNoise = 100;
                        document.getElementById('msg').innerText = "ВЫ ВЗЛОМАЛИ ЛЮК И СБЕЖАЛИ!";
                        isGameOver = true;
                        setTimeout(() => location.reload(), 3000);
                    } else {
                        document.getElementById('msg').innerText = "Люк заклинило! Найдите домкрат.";
                    }
                }
            }
        }

        // --- ИГРОВОЙ ЦИКЛ ---
        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            // Движение игрока
            const speed = 0.05;
            if (moveVector.x !== 0 || moveVector.z !== 0) {
                const dir = new THREE.Vector3(moveVector.x, 0, moveVector.z).normalize();
                dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
                player.position.addScaledVector(dir, speed);
                currentNoise = Math.min(currentNoise + 1.5, 40);
            } else {
                currentNoise = Math.max(0, currentNoise - 0.8);
            }

            // Границы подвала
            player.position.x = Math.max(-9, Math.min(9, player.position.x));
            player.position.z = Math.max(-9, Math.min(9, player.position.z));

            document.getElementById('noise').innerText = Math.floor(currentNoise);

            // Разрядка батареи
            if (flashlightOn && battery > 0) {
                battery -= 0.02;
                document.getElementById('battery').innerText = Math.max(0, Math.floor(battery));
                if (battery <= 0) flashLight.visible = false;
            }

            // ИИ Бабушки
            if (currentNoise > 20) {
                const dirToPlayer = new THREE.Vector3().subVectors(player.position, granny.position);
                dirToPlayer.y = 0;
                if (dirToPlayer.length() > 0.6) {
                    dirToPlayer.normalize();
                    granny.position.addScaledVector(dirToPlayer, 0.02);
                }
            }

            // Проверка поимки
            if (granny.position.distanceTo(player.position) < 1.2) {
                isGameOver = true;
                document.getElementById('msg').innerText = "БАБУШКА ВАС ПОЙМАЛА!";
                setTimeout(() => location.reload(), 3000);
            }

            renderer.render(scene, camera);
        }

        // Адаптация под iPhone
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
