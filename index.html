<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Manager Pro - Director Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #09090b;
            --card-bg: rgba(20, 20, 25, 0.75);
            --accent-red: #e10600;
            --gold: #f39c12;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 90px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 20%, #1a1518 0%, var(--bg-dark) 70%);
            min-height: 100vh;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(10, 10, 12, 0.9);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .league-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--accent-red);
            text-transform: uppercase;
        }

        .director-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .director-name {
            font-size: 13px;
            font-weight: 600;
            text-align: right;
        }

        .director-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            background: #27272a;
        }

        /* Content Sections */
        .section {
            display: none;
            padding: 15px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Main Fighter Showcase (Dashboard) */
        .octagon-stage {
            position: relative;
            background: linear-gradient(180deg, rgba(25,25,30,0.6) 0%, rgba(10,10,12,0.9) 100%);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            overflow: hidden;
            touch-action: pan-y; /* Разрешаем скролл страницы, но ловим жесты на персонаже */
        }

        .octagon-stage::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(225,6,0,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Контейнер с поддержкой 360-градусного вращения */
        .fighter-render-container {
            position: relative;
            width: 180px;
            height: 240px;
            margin: 0 auto 15px auto;
            cursor: grab;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .fighter-render-container:active {
            cursor: grabbing;
        }

        .fighter-body-model {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .model-welterweight { 
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.15)); 
        }

        .fighter-face-overlay {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--gold);
            background: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: none; /* Чтобы свайп шел по контейнеру */
        }

        .fighter-face-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rotate-hint {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .fighter-info-card h2 {
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .fighter-badge {
            display: inline-block;
            background: rgba(243, 156, 18, 0.15);
            color: var(--gold);
            border: 1px solid rgba(243, 156, 18, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Cards & Grids */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            backdrop-filter: blur(10px);
        }

        .card-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .card-value {
            font-size: 20px;
            font-weight: 800;
        }

        /* Action Buttons */
        .btn-action {
            background: linear-gradient(135deg, var(--accent-red) 0%, #b30500 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(225, 6, 0, 0.4);
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(12, 12, 16, 0.95);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            backdrop-filter: blur(15px);
            z-index: 100;
        }

        .nav-item {
            text-align: center;
            color: var(--text-muted);
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.2s;
            flex: 1;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            margin-bottom: 3px;
            fill: currentColor;
        }

        .nav-item.active {
            color: var(--accent-red);
        }
    </style>
</head>
<body>

    <!-- Шапка профиля -->
    <div class="top-bar">
        <div class="league-title">UFC Director Mode</div>
        <div class="director-profile">
            <div>
                <div class="director-name" id="dir-name">Директор</div>
                <div style="font-size: 9px; color: var(--gold); text-align: right;">PROMOTER</div>
            </div>
            <img src="https://via.placeholder.com/150" alt="Avatar" class="director-avatar" id="dir-avatar">
        </div>
    </div>

    <!-- Вкладка 1: Главная -->
    <div id="tab-home" class="section active">
        <div class="octagon-stage">
            <div class="rotate-hint">⟵ Свайпай, чтобы повернуть ⟶</div>
            
            <!-- Контейнер персонажа с поддержкой вращения 360 -->
            <div class="fighter-render-container" id="fighterContainer">
                <div class="fighter-body-model model-welterweight" style="background-image: url('https://i.ibb.co/5W3z249/ufc-fighter-silhouette.png');"></div>
                <div class="fighter-face-overlay">
                    <img src="https://via.placeholder.com/150" alt="Face" id="fighter-face">
                </div>
            </div>
            
            <div class="fighter-info-card">
                <h2 id="fighter-name">Имя Бойца</h2>
                <span class="fighter-badge" id="fighter-category">Welterweight (77 кг)</span>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <div class="card-title">Баланс Лиги</div>
                <div class="card-value" style="color: #2ecc71;">$1,450,000</div>
            </div>
            <div class="card">
                <div class="card-title">Рейтинг P4P</div>
                <div class="card-value" style="color: var(--gold);">#1 ЧЕМПИОН</div>
            </div>
        </div>

        <button class="btn-action" onclick="alert('Переход к управлению карда')">Управление кардом</button>
    </div>

    <!-- Вкладка 2: Ростер -->
    <div id="tab-roster" class="section">
        <h2 style="font-size: 18px; margin-bottom: 15px; text-transform: uppercase;">Ростер организации</h2>
        <div class="card">
            <p style="color: var(--text-muted); font-size: 13px;">Список бойцов загружается...</p>
        </div>
    </div>

    <!-- Вкладка 3: Финансы -->
    <div id="tab-finances" class="section">
        <h2 style="font-size: 18px; margin-bottom: 15px; text-transform: uppercase;">Казна и PPV</h2>
        <div class="card">
            <p style="color: var(--text-muted); font-size: 13px;">Финансовый отчет лиги.</p>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <nav class="nav-bar">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Главная
        </div>
        <div class="nav-item" onclick="switchTab('roster', this)">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            Ростер
        </div>
        <div class="nav-item" onclick="switchTab('finances', this)">
            <svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2 c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
            Финансы
        </div>
    </nav>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('dir-name').innerText = user.first_name || 'Директор';
            if (user.photo_url) {
                document.getElementById('dir-avatar').src = user.photo_url;
                document.getElementById('fighter-face').src = user.photo_url;
            }
        }

        // Переключение вкладок
        function switchTab(tabId, element) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
        }

        // Логика вращения персонажа на 360 градусов свайпом
        const container = document.getElementById('fighterContainer');
        let isDragging = false;
        let startX = 0;
        let currentRotation = 0;

        container.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startX = e.clientX;
            container.setPointerCapture(e.pointerId);
        });

        container.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            // Умножаем на коэффициент для плавной скорости вращения
            currentRotation += deltaX * 0.8;
            
            // Применяем вращение по оси Y (360 градусов)
            container.style.transform = `rotateY(${currentRotation}deg)`;
            startX = e.clientX;
        });

        container.addEventListener('pointerup', (e) => {
            isDragging = false;
            container.releasePointerCapture(e.pointerId);
        });

        container.addEventListener('pointercancel', (e) => {
            isDragging = false;
        });
    </script>
</body>
</html>
