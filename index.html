<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UFC Director Mode</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-deep: #030305;
            --accent-red: #ff1e00;
            --accent-glow: rgba(255, 30, 0, 0.4);
            --gold: #f39c12;
            --gold-glow: rgba(243, 156, 18, 0.2);
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            /* Световой эффект сверху вниз */
            --top-spotlight: radial-gradient(circle at 50% -10%, rgba(0, 122, 255, 0.18) 0%, rgba(3, 3, 5, 0) 65%),
                              radial-gradient(circle at 50% 0%, rgba(255, 30, 0, 0.08) 0%, transparent 70%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            background-image: var(--top-spotlight), linear-gradient(180deg, #030305 0%, #0a0a0f 100%);
            color: var(--text-main);
            padding-bottom: 110px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Верхняя панель */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(5, 5, 8, 0.75);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        .league-title {
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent-red);
            text-transform: uppercase;
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .director-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .director-info {
            text-align: right;
        }

        .director-role {
            font-size: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .director-name {
            font-size: 12px;
            font-weight: 700;
        }

        .director-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            box-shadow: 0 0 10px var(--gold-glow);
            background: #111;
        }

        /* Секции */
        .section {
            display: none;
            padding: 20px 16px;
        }

        .section.active {
            display: block;
        }

        .hero-stage {
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        .rotate-hint {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* 3D Сцена с бойцом */
        .fighter-container {
            position: relative;
            width: 190px;
            height: 260px;
            margin: 0 auto 12px auto;
            cursor: grab;
            transform-style: preserve-3d;
            touch-action: none;
        }

        .fighter-container:active {
            cursor: grabbing;
        }

        .fighter-silhouette {
            width: 100%;
            height: 100%;
            background: url('https://i.ibb.co/5W3z249/ufc-fighter-silhouette.png') no-repeat center/contain;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.9)) drop-shadow(0 0 25px rgba(255,30,0,0.12));
        }

        .fighter-face-overlay {
            position: absolute;
            top: 19%;
            left: 50%;
            transform: translateX(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--gold);
            background: #111;
            box-shadow: 0 0 15px var(--gold-glow);
            pointer-events: none;
        }

        .fighter-face-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fighter-badge {
            display: inline-block;
            background: rgba(243, 156, 18, 0.06);
            color: var(--gold);
            border: 1px solid rgba(243, 156, 18, 0.15);
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Метрики без грубых прямоугольников (бесшовный дизайн с акцентными линиями) */
        .metrics-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            padding: 0 4px;
        }

        .metric-item {
            background: transparent;
            border-left: 2px solid rgba(255, 255, 255, 0.08);
            padding: 4px 0 4px 12px;
        }

        .metric-item.accent-border {
            border-left-color: var(--accent-red);
        }

        .metric-item.gold-border {
            border-left-color: var(--gold);
        }

        .metric-title {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .metric-value {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        /* Премиум Кнопка */
        .btn-main {
            background: linear-gradient(135deg, #ff1e00 0%, #b30000 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 8px 25px var(--accent-glow);
            transition: transform 0.1s ease;
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        /* Нижняя навигация */
        .nav-bar {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(10, 10, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-radius: 22px;
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        .nav-item {
            text-align: center;
            color: var(--text-muted);
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 800;
            cursor: pointer;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .nav-item.active {
            color: var(--accent-red);
            text-shadow: 0 0 10px var(--accent-glow);
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="top-bar">
        <div class="league-title">UFC Director</div>
        <div class="director-profile">
            <div class="director-info">
                <div class="director-role">UFC Director</div>
                <div class="director-name" id="dir-name">Директор</div>
            </div>
            <img src="https://via.placeholder.com/150" alt="Avatar" class="director-avatar" id="dir-avatar">
        </div>
    </div>

    <!-- Вкладка: Главная -->
    <div id="tab-home" class="section active">
        <div class="hero-stage">
            <div class="rotate-hint">‹ Свайпай для вращения 360° ›</div>
            
            <div class="fighter-container" id="fighterContainer">
                <div class="fighter-silhouette"></div>
                <div class="fighter-face-overlay">
                    <img src="https://via.placeholder.com/150" alt="Face" id="fighter-face">
                </div>
            </div>
            
            <div class="fighter-info">
                <div class="fighter-badge" id="fighter-category">Welterweight • 77 кг</div>
            </div>
        </div>

        <!-- Премиум-метрики без тяжелых прямоугольников -->
        <div class="metrics-container">
            <div class="metric-item accent-border">
                <div class="metric-title">Казна Лиги</div>
                <div class="metric-value" id="league-balance" style="color: #2ecc71;">$1,450,000</div>
            </div>
            <div class="metric-item gold-border">
                <div class="metric-title">Рейтинг P4P</div>
                <div class="metric-value" style="color: var(--gold);">#1 ЧЕМПИОН</div>
            </div>
        </div>

        <button class="btn-main" onclick="alert('Открытие карда турнира...')">Управление кардом</button>
    </div>

    <!-- Вкладка: Ростер -->
    <div id="tab-roster" class="section">
        <h2 style="font-size: 16px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;">Ростер бойцов</h2>
        <div style="color: var(--text-muted); font-size: 12px; font-weight: 600;">Синхронизация с базой данных...</div>
    </div>

    <!-- Вкладка: Финансы -->
    <div id="tab-finances" class="section">
        <h2 style="font-size: 16px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;">Казна и PPV</h2>
        <div style="color: var(--text-muted); font-size: 12px; font-weight: 600;">Финансовая отчетность лиги в реальном времени.</div>
    </div>

    <!-- Нижняя навигация -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Главная
        </div>
        <div class="nav-item" onclick="switchTab('roster', this)">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            Ростер
        </div>
        <div class="nav-item" onclick="switchTab('finances', this)">
            <svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
            Финансы
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Автоматическое определение пользователя из Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('dir-name').innerText = user.first_name;
            if (user.photo_url) {
                document.getElementById('dir-avatar').src = user.photo_url;
                document.getElementById('fighter-face').src = user.photo_url;
            }
        }

        // Переключение вкладок
        function switchTab(tabId, element) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
        }

        // Логика 360-градусного вращения бойца с помощью свайпов
        const container = document.getElementById('fighterContainer');
        let isDragging = false, startX = 0, currentRotation = 0;

        container.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startX = e.clientX;
            container.setPointerCapture(e.pointerId);
        });

        container.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            currentRotation += (e.clientX - startX) * 0.9;
            container.style.transform = `rotateY(${currentRotation}deg)`;
            startX = e.clientX;
        });

        container.addEventListener('pointerup', (e) => {
            isDragging = false;
            container.releasePointerCapture(e.pointerId);
        });
    </script>
</body>
</html>
