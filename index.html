<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UFC Director Mode</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-deep: #030305;
            --accent-red: #ff1e00;
            --accent-glow: rgba(255, 30, 0, 0.4);
            --gold: #f39c12;
            --gold-glow: rgba(243, 156, 18, 0.2);
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            
            --top-spotlight: 
                radial-gradient(circle at 50% -15%, rgba(0, 130, 255, 0.28) 0%, rgba(3, 3, 5, 0) 55%),
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 20%, rgba(255, 30, 0, 0.05) 0%, transparent 60%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            background-image: var(--top-spotlight), linear-gradient(180deg, #05070f 0%, #030305 100%);
            background-attachment: fixed;
            color: var(--text-main);
            padding-bottom: 110px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(5, 5, 8, 0.75);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        .league-title {
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent-red);
            text-transform: uppercase;
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .director-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .director-info {
            text-align: right;
        }

        .director-role {
            font-size: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .director-name {
            font-size: 12px;
            font-weight: 700;
        }

        .director-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            box-shadow: 0 0 10px var(--gold-glow);
            background: #111;
        }

        .section {
            display: none;
            padding: 20px 16px;
        }

        .section.active {
            display: block;
        }

        .hero-stage {
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        .rotate-hint {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .fighter-container {
            position: relative;
            width: 190px;
            height: 260px;
            margin: 0 auto 12px auto;
            cursor: grab;
            transform-style: preserve-3d;
            touch-action: none;
        }

        .fighter-silhouette {
            width: 100%;
            height: 100%;
            background: url('https://i.ibb.co/5W3z249/ufc-fighter-silhouette.png') no-repeat center/contain;
            filter: drop-shadow(0 25px 35px rgba(0,0,0,0.95)) drop-shadow(0 0 30px rgba(0, 122, 255, 0.2));
        }

        .fighter-face-overlay {
            position: absolute;
            top: 19%;
            left: 50%;
            transform: translateX(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--gold);
            background: #111;
            box-shadow: 0 0 15px var(--gold-glow);
            pointer-events: none;
        }

        .fighter-face-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fighter-badge {
            display: inline-block;
            background: rgba(243, 156, 18, 0.06);
            color: var(--gold);
            border: 1px solid rgba(243, 156, 18, 0.15);
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .metrics-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            padding: 0 4px;
        }

        .metric-item {
            background: transparent;
            border-left: 2px solid rgba(255, 255, 255, 0.08);
            padding: 4px 0 4px 12px;
        }

        .metric-item.accent-border { border-left-color: var(--accent-red); }
        .metric-item.gold-border { border-left-color: var(--gold); }

        .metric-title {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .metric-value {
            font-size: 20px;
            font-weight: 900;
        }

        .btn-main {
            background: linear-gradient(135deg, #ff1e00 0%, #b30000 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .nav-bar {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(10, 10, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-radius: 22px;
            backdrop-filter: blur(20px);
        }

        .nav-item {
            text-align: center;
            color: var(--text-muted);
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 800;
            cursor: pointer;
        }

        .nav-item.active { color: var(--accent-red); }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="league-title">UFC Director</div>
        <div class="director-profile">
            <div class="director-info">
                <div class="director-role" id="dir-role">PROMOTER</div>
                <div class="director-name" id="dir-name">Директор</div>
            </div>
            <img src="https://via.placeholder.com/150" alt="Avatar" class="director-avatar" id="dir-avatar">
        </div>
    </div>

    <div id="tab-home" class="section active">
        <div class="hero-stage">
            <div class="rotate-hint">‹ Свайпай для вращения 360° ›</div>
            <div class="fighter-container" id="fighterContainer">
                <div class="fighter-silhouette"></div>
                <div class="fighter-face-overlay">
                    <img src="https://via.placeholder.com/150" alt="Face" id="fighter-face">
                </div>
            </div>
            <div class="fighter-badge">Welterweight • 77 кг</div>
        </div>

        <div class="metrics-container">
            <div class="metric-item accent-border">
                <div class="metric-title">Казна Лиги</div>
                <div class="metric-value" style="color: #2ecc71;">$1,450,000</div>
            </div>
            <div class="metric-item gold-border">
                <div class="metric-title">Рейтинг P4P</div>
                <div class="metric-value" style="color: var(--gold);">#1 ЧЕМПИОН</div>
            </div>
        </div>
        <button class="btn-main" onclick="alert('Управление кардом...')">Управление кардом</button>
    </div>

    <div id="tab-roster" class="section"><h2>Ростер бойцов</h2></div>
    <div id="tab-finances" class="section"><h2>Финансы</h2></div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('home', this)">Главная</div>
        <div class="nav-item" onclick="switchTab('roster', this)">Ростер</div>
        <div class="nav-item" onclick="switchTab('finances', this)">Финансы</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Ваш личный ID администратора
        const ADMIN_ID = 5208615220; 

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('dir-name').innerText = user.first_name;
            
            // Логика проверки:
            if (user.id === ADMIN_ID) {
                document.getElementById('dir-role').innerText = "UFC DIRECTOR";
                document.getElementById('dir-role').style.color = "#ff1e00";
            } else {
                document.getElementById('dir-role').innerText = "PROMOTER";
            }

            if (user.photo_url) {
                document.getElementById('dir-avatar').src = user.photo_url;
                document.getElementById('fighter-face').src = user.photo_url;
            }
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
        }

        const container = document.getElementById('fighterContainer');
        let isDragging = false, startX = 0, currentRotation = 0;

        container.addEventListener('pointerdown', (e) => { isDragging = true; startX = e.clientX; });
        container.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            currentRotation += (e.clientX - startX) * 0.9;
            container.style.transform = `rotateY(${currentRotation}deg)`;
            startX = e.clientX;
        });
        container.addEventListener('pointerup', () => { isDragging = false; });
    </script>
</body>
</html>
