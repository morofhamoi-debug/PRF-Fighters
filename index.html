<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Modern House 3D — Refactored</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%;
        font-family:'Segoe UI',sans-serif; background:#000; color:#fff;
        touch-action:none; user-select:none; -webkit-user-select:none; }
    #app { position:fixed; inset:0; }
    canvas { display:block; }
    #crosshair { position:absolute; top:50%; left:50%; width:8px; height:8px;
        border:1.5px solid rgba(255,255,255,.9); border-radius:50%;
        transform:translate(-50%,-50%); pointer-events:none; z-index:5;
        box-shadow:0 0 4px rgba(0,0,0,.8); transition:transform .15s; }
    #crosshair.active { transform:translate(-50%,-50%) scale(1.5); border-color:#ffcc00; }
    #hint { position:absolute; top:max(12px,env(safe-area-inset-top)); left:50%;
        transform:translateX(-50%); background:rgba(0,0,0,.55); padding:8px 18px;
        border-radius:100px; font-size:13px; letter-spacing:.5px;
        backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.12);
        white-space:nowrap; transition:opacity .6s; z-index:10; pointer-events:none; }
    #hint.hidden { opacity:0; }
    #fps { position:absolute; top:max(12px,env(safe-area-inset-top));
        right:max(12px,env(safe-area-inset-right)); background:rgba(0,0,0,.5);
        padding:4px 10px; border-radius:6px; font-size:11px;
        font-family:monospace; color:#7fff7f; z-index:10; }
    #blocker { position:absolute; inset:0; display:flex; align-items:center;
        justify-content:center; z-index:30; cursor:pointer;
        background:radial-gradient(ellipse at center,rgba(20,25,35,.85),rgba(5,5,10,.98));
        transition:opacity .5s; }
    #blocker.hidden { opacity:0; pointer-events:none; }
    #blocker .panel { text-align:center; padding:40px 50px;
        background:rgba(15,18,26,.85); border-radius:20px;
        border:1px solid rgba(255,255,255,.1); backdrop-filter:blur(20px);
        max-width:90vw; box-shadow:0 20px 60px rgba(0,0,0,.6); }
    #blocker h1 { margin:0 0 8px; font-size:clamp(22px,5vw,32px);
        font-weight:200; letter-spacing:6px;
        background:linear-gradient(135deg,#fff,#a8c0ff);
        -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        background-clip:text; }
    #blocker .sub { opacity:.6; font-size:12px; letter-spacing:3px;
        margin-bottom:25px; text-transform:uppercase; }
    #blocker .play-btn { display:inline-block; padding:14px 44px;
        background:linear-gradient(135deg,#4a7fff,#2a5edd); border-radius:100px;
        font-size:15px; font-weight:500; letter-spacing:2px; text-transform:uppercase;
        transition:transform .2s,box-shadow .2s; box-shadow:0 8px 24px rgba(74,127,255,.4); }
    #blocker:hover .play-btn { transform:scale(1.05); box-shadow:0 12px 32px rgba(74,127,255,.6); }
    #blocker .controls-hint { margin-top:22px; opacity:.45; font-size:11px; line-height:1.9; }
    #blocker .controls-hint kbd { display:inline-block; padding:1px 6px;
        background:rgba(255,255,255,.1); border-radius:4px;
        font-family:monospace; border:1px solid rgba(255,255,255,.15); margin:0 2px; }
    #loading { position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
        text-align:center; z-index:25; font-size:11px; letter-spacing:3px; opacity:.7; }
    #loading .bar { width:200px; height:2px; background:rgba(255,255,255,.1);
        border-radius:2px; margin:10px auto 0; overflow:hidden; }
    #loading .bar div { width:0%; height:100%;
        background:linear-gradient(90deg,#4a7fff,#a8c0ff); transition:width .3s; }
    #mobile-ui { display:none; }
    #mobile-ui.visible { display:block; }
    #joy-zone { position:absolute; left:max(20px,env(safe-area-inset-left));
        bottom:max(20px,env(safe-area-inset-bottom)); width:150px; height:150px;
        z-index:15; touch-action:none; }
    #joy-base { position:absolute; width:140px; height:140px; left:5px; top:5px;
        border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.03) 70%,transparent);
        border:2px solid rgba(255,255,255,.15); backdrop-filter:blur(8px); }
    #joy-knob { position:absolute; width:60px; height:60px; left:40px; top:40px;
        border-radius:50%; background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),rgba(120,150,200,.35));
        border:2px solid rgba(255,255,255,.4);
        box-shadow:0 4px 16px rgba(0,0,0,.3),inset 0 2px 6px rgba(255,255,255,.3);
        transition:transform .05s linear; pointer-events:none; }
    #look-zone { position:absolute; right:0; top:0; width:55%; height:100%;
        z-index:14; touch-action:none; }
    .action-btn { position:absolute; border-radius:50%;
        background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.2),rgba(0,0,0,.35));
        border:2px solid rgba(255,255,255,.3); color:#fff;
        font-size:11px; font-weight:600; letter-spacing:1px;
        display:flex; align-items:center; justify-content:center;
        text-align:center; z-index:16; touch-action:none; user-select:none;
        backdrop-filter:blur(6px); transition:transform .1s,background .1s; }
    .action-btn:active, .action-btn.pressed { transform:scale(.9);
        background:radial-gradient(circle at 30% 30%,rgba(120,180,255,.6),rgba(74,127,255,.4));
        border-color:rgba(120,180,255,.8); }
    #btn-jump { right:max(24px,env(safe-area-inset-right));
        bottom:max(24px,env(safe-area-inset-bottom)); width:78px; height:78px; font-size:22px; }
    #btn-run { right:max(24px,env(safe-area-inset-right));
        bottom:calc(max(24px,env(safe-area-inset-bottom)) + 95px);
        width:62px; height:62px; }
    #btn-use { right:calc(max(24px,env(safe-area-inset-right)) + 95px);
        bottom:max(24px,env(safe-area-inset-bottom)); width:62px; height:62px;
        font-size:14px; opacity:.6; transition:opacity .2s,transform .1s,background .1s; }
    #btn-use.available { opacity:1; border-color:rgba(255,204,0,.8);
        box-shadow:0 0 20px rgba(255,204,0,.5); }
    #btn-run.active { background:radial-gradient(circle at 30% 30%,rgba(255,200,50,.6),rgba(200,120,0,.4));
        border-color:rgba(255,200,50,.8); }
    #interact-prompt { position:absolute; top:58%; left:50%; transform:translateX(-50%);
        background:rgba(0,0,0,.7); padding:6px 16px; border-radius:100px;
        font-size:12px; letter-spacing:1px; pointer-events:none; z-index:10;
        opacity:0; transition:opacity .2s; border:1px solid rgba(255,204,0,.3);
        white-space:nowrap; }
    #interact-prompt.visible { opacity:1; }
    @media (max-height:480px) {
        #joy-zone{width:120px;height:120px} #joy-base{width:110px;height:110px}
        #joy-knob{width:50px;height:50px;left:30px;top:30px}
    }
</style>
</head>
<body>
<div id="app">
    <div id="crosshair"></div>
    <div id="hint">WASD — движение · Мышь — обзор · Shift — бег · Space — прыжок · E — действие</div>
    <div id="fps">--- FPS</div>
    <div id="interact-prompt"></div>
    <div id="mobile-ui">
        <div id="look-zone"></div>
        <div id="joy-zone"><div id="joy-base"></div><div id="joy-knob"></div></div>
        <div class="action-btn" id="btn-jump">↑</div>
        <div class="action-btn" id="btn-run">RUN</div>
        <div class="action-btn" id="btn-use">USE</div>
    </div>
    <div id="blocker">
        <div class="panel">
            <h1>MODERN HOUSE</h1>
            <div class="sub">Refactored · Physics · Interactions</div>
            <div class="play-btn">Играть</div>
            <div class="controls-hint">
                <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> движение · <kbd>Shift</kbd> бег · <kbd>Space</kbd> прыжок · <kbd>E</kbd> действие · <kbd>Esc</kbd> пауза
            </div>
        </div>
    </div>
    <div id="loading"><div>ЗАГРУЗКА СЦЕНЫ</div><div class="bar"><div id="loading-bar"></div></div></div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

// ============================================================
// 0. PLATFORM
// ============================================================
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
    || (navigator.maxTouchPoints > 1 && window.innerWidth < 1200);

const QUALITY = isMobile ? {
    pixelRatio: 1.0, shadowMapSize: 1024, shadowMapType: THREE.PCFShadowMap,
    bloom: true, bloomStrength: 0.35, bloomRadius: 0.4,
    smaa: false, sunShadow: true, rectAreaLights: false,
    textureSize: 512, maxPointLights: 3
} : {
    pixelRatio: Math.min(window.devicePixelRatio, 2), shadowMapSize: 4096,
    shadowMapType: THREE.PCFSoftShadowMap, bloom: true, bloomStrength: 0.4,
    bloomRadius: 0.5, smaa: true, sunShadow: true, rectAreaLights: true,
    textureSize: 1024, maxPointLights: 6
};

// ============================================================
// 1. RENDERER
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', stencil: false });
renderer.setPixelRatio(QUALITY.pixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = QUALITY.shadowMapType;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

// ============================================================
// 2. SCENE / CAMERA / PLAYER
// ============================================================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xa8c4d8, 0.008);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 500);
camera.rotation.order = 'YXZ';

const PLAYER_HEIGHT = 1.7;
const PLAYER_RADIUS = 0.3;

const player = new THREE.Object3D();
player.position.set(0, PLAYER_HEIGHT + 0.01, 14);
player.add(camera);
scene.add(player);

// ============================================================
// 3. SKY / ENVIRONMENT
// ============================================================
RectAreaLightUniformsLib.init();

const sky = new Sky();
sky.scale.setScalar(10000);
scene.add(sky);

const skyU = sky.material.uniforms;
skyU['turbidity'].value = 6;
skyU['rayleigh'].value = 2.2;
skyU['mieCoefficient'].value = 0.005;
skyU['mieDirectionalG'].value = 0.82;

const sunElevation = 32;
const sunAzimuth = 145;
const sunPhi = THREE.MathUtils.degToRad(90 - sunElevation);
const sunTheta = THREE.MathUtils.degToRad(sunAzimuth);
const sunPos = new THREE.Vector3().setFromSphericalCoords(1, sunPhi, sunTheta);
skyU['sunPosition'].value.copy(sunPos);

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const skyScene = new THREE.Scene();
skyScene.add(sky.clone());
const envMap = pmrem.fromScene(skyScene, 0.04).texture;
scene.environment = envMap;

// ============================================================
// 4. GLOBAL LIGHTING
// ============================================================
const sunLight = new THREE.DirectionalLight(0xfff0dd, 3.2);
sunLight.position.copy(sunPos).multiplyScalar(40);
sunLight.target.position.set(0, 0, 0);
scene.add(sunLight.target);
if (QUALITY.sunShadow) {
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(QUALITY.shadowMapSize, QUALITY.shadowMapSize);
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 100;
    sunLight.shadow.camera.left = -22;
    sunLight.shadow.camera.right = 22;
    sunLight.shadow.camera.top = 22;
    sunLight.shadow.camera.bottom = -22;
    sunLight.shadow.bias = -0.0003;
    sunLight.shadow.normalBias = 0.02;
    sunLight.shadow.radius = 4;
}
scene.add(sunLight);

scene.add(new THREE.HemisphereLight(0xa8c4d8, 0x3a4a2a, 0.55));
scene.add(new THREE.AmbientLight(0xffffff, 0.12));

// ============================================================
// 5. PROCEDURAL TEXTURES (improved normal maps)
// ============================================================
const TS = QUALITY.textureSize;

function createCanvas(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    return c;
}

function makeTex(canvas, isColor = true) {
    const t = new THREE.CanvasTexture(canvas);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = isMobile ? 4 : 16;
    t.colorSpace = isColor ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.needsUpdate = true;
    return t;
}

// Improved: Sobel-based normal map with proper scaling
function generateNormalMap(sourceCanvas, strength = 1.5) {
    const w = sourceCanvas.width, h = sourceCanvas.height;
    const srcCtx = sourceCanvas.getContext('2d');
    const src = srcCtx.getImageData(0, 0, w, h).data;

    const out = createCanvas(w);
    const outCtx = out.getContext('2d');
    const outImg = outCtx.createImageData(w, h);
    const d = outImg.data;

    const lum = (x, y) => {
        x = (x + w) % w; y = (y + h) % h;
        const i = (y * w + x) * 4;
        return (src[i] * 0.299 + src[i+1] * 0.587 + src[i+2] * 0.114) / 255;
    };

    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const idx = (y * w + x) * 4;
            // Sobel
            const tl = lum(x-1,y-1), t = lum(x,y-1), tr = lum(x+1,y-1);
            const l = lum(x-1,y),   r = lum(x+1,y);
            const bl = lum(x-1,y+1), b = lum(x,y+1), br = lum(x+1,y+1);
            const gx = (tr + 2*r + br) - (tl + 2*l + bl);
            const gy = (bl + 2*b + br) - (tl + 2*t + tr);

            let nx = -gx * strength * 0.5;
            let ny = -gy * strength * 0.5;
            let nz = 1;
            const len = Math.hypot(nx, ny, nz);
            nx /= len; ny /= len; nz /= len;

            d[idx] = (nx * 0.5 + 0.5) * 255;
            d[idx+1] = (ny * 0.5 + 0.5) * 255;
            d[idx+2] = (nz * 0.5 + 0.5) * 255;
            d[idx+3] = 255;
        }
    }
    outCtx.putImageData(outImg, 0, 0);
    return out;
}

function generateRoughnessMap(sourceCanvas, base = 0.8, variance = 0.2) {
    const w = sourceCanvas.width, h = sourceCanvas.height;
    const src = sourceCanvas.getContext('2d').getImageData(0, 0, w, h).data;
    const out = createCanvas(w);
    const outCtx = out.getContext('2d');
    const outImg = outCtx.createImageData(w, h);
    const d = outImg.data;
    for (let i = 0; i < w * h; i++) {
        const idx = i * 4;
        const lum = (src[idx] * 0.299 + src[idx+1] * 0.587 + src[idx+2] * 0.114) / 255;
        const r = Math.max(0, Math.min(1, base + (lum - 0.5) * variance));
        d[idx] = d[idx+1] = d[idx+2] = r * 255;
        d[idx+3] = 255;
    }
    outCtx.putImageData(outImg, 0, 0);
    return out;
}

// ---- Wood (parquet) ----
function createWoodCanvas() {
    const c = createCanvas(TS), ctx = c.getContext('2d'), w = TS, h = TS;
    ctx.fillStyle = '#7d5a3c'; ctx.fillRect(0, 0, w, h);
    const plankH = h / 5;
    for (let p = 0; p < 5; p++) {
        const y = p * plankH;
        const hue = 26 + Math.random() * 14, light = 42 + Math.random() * 10;
        ctx.fillStyle = `hsl(${hue},38%,${light}%)`;
        ctx.fillRect(0, y, w, plankH - 2);
        ctx.fillStyle = 'rgba(20,10,0,0.7)';
        ctx.fillRect(0, y + plankH - 2, w, 2);
        for (let i = 0; i < 70; i++) {
            const fy = y + Math.random() * (plankH - 4);
            const sx = Math.random() * w, len = 30 + Math.random() * (w / 2);
            ctx.strokeStyle = `hsla(${hue},30%,${light-15+Math.random()*18}%,${0.15+Math.random()*0.2})`;
            ctx.lineWidth = 0.5 + Math.random() * 2;
            ctx.beginPath(); ctx.moveTo(sx, fy);
            for (let x = sx; x < sx + len && x < w; x += 4)
                ctx.lineTo(x, fy + Math.sin(x * 0.05 + p) * 1.5);
            ctx.stroke();
        }
        const splitX = Math.random() * w;
        ctx.fillStyle = 'rgba(20,10,0,0.5)';
        ctx.fillRect(splitX, y, 1.5, plankH - 2);
    }
    return c;
}

// ---- Plaster ----
function createWallCanvas() {
    const c = createCanvas(TS), ctx = c.getContext('2d'), w = TS, h = TS;
    ctx.fillStyle = '#e8e3da'; ctx.fillRect(0, 0, w, h);
    const img = ctx.getImageData(0, 0, w, h), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - 0.5) * 16;
        d[i] = Math.max(0, Math.min(255, d[i] + n));
        d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
        d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
    }
    ctx.putImageData(img, 0, 0);
    for (let i = 0; i < 30; i++) {
        ctx.fillStyle = `rgba(120,110,100,${Math.random() * 0.03})`;
        ctx.beginPath(); ctx.arc(Math.random() * w, Math.random() * h, 20 + Math.random() * 60, 0, Math.PI * 2); ctx.fill();
    }
    return c;
}

// ---- Tile ----
function createTileCanvas() {
    const c = createCanvas(TS), ctx = c.getContext('2d'), w = TS, h = TS;
    ctx.fillStyle = '#9a9085'; ctx.fillRect(0, 0, w, h);
    const t = w / 4, gap = 3;
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
        const v = 175 + Math.random() * 15 - 7;
        ctx.fillStyle = `rgb(${v},${v - 5},${v - 12})`;
        ctx.fillRect(x * t + gap, y * t + gap, t - gap * 2, t - gap * 2);
        ctx.strokeStyle = 'rgba(120,110,100,0.15)';
        ctx.lineWidth = 0.8;
        for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            const sx = x * t + Math.random() * t, sy = y * t + Math.random() * t;
            ctx.moveTo(sx, sy);
            ctx.bezierCurveTo(sx + 30, sy + 20, sx + 30, sy - 20, sx + 60, sy + 10);
            ctx.stroke();
        }
        const g = ctx.createLinearGradient(x * t, y * t, (x+1) * t, (y+1) * t);
        g.addColorStop(0, 'rgba(255,255,255,0.15)');
        g.addColorStop(0.5, 'rgba(255,255,255,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.1)');
        ctx.fillStyle = g;
        ctx.fillRect(x * t + gap, y * t + gap, t - gap * 2, t - gap * 2);
    }
    return c;
}

// ---- Metal ----
function createMetalCanvas() {
    const c = createCanvas(TS), ctx = c.getContext('2d'), w = TS, h = TS;
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#d8d8d8'); g.addColorStop(.3, '#a8a8a8');
    g.addColorStop(.7, '#b8b8b8'); g.addColorStop(1, '#c8c8c8');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 4000; i++) {
        ctx.strokeStyle = `rgba(255,255,255,${Math.random() * 0.08})`;
        const x = Math.random() * w;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + (Math.random() - 0.5) * 2, h); ctx.stroke();
    }
    return c;
}

// ---- Fabric ----
function createFabricCanvas() {
    const c = createCanvas(TS), ctx = c.getContext('2d'), w = TS, h = TS;
    ctx.fillStyle = '#3a4a5c'; ctx.fillRect(0, 0, w, h);
    const s = 4;
    for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) {
        const sh = (x + y) % (s * 2) === 0 ? 15 : -15;
        ctx.fillStyle = `rgba(${60+sh},${80+sh},${100+sh},0.4)`;
        ctx.fillRect(x, y, s, s);
    }
    for (let i = 0; i < 3000; i++) {
        ctx.fillStyle = `rgba(${100+Math.random()*60},${120+Math.random()*60},${150+Math.random()*60},0.15)`;
        ctx.fillRect(Math.random() * w, Math.random() * h, 1, 1);
    }
    return c;
}

// ---- Grass ----
function createGrassCanvas() {
    const c = createCanvas(TS), ctx = c.getContext('2d'), w = TS, h = TS;
    ctx.fillStyle = '#2e5025'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 8000; i++) {
        const g = 60 + Math.random() * 80, r = 40 + Math.random() * 40;
        ctx.strokeStyle = `rgb(${r},${g},${30+Math.random()*30})`;
        ctx.lineWidth = 0.5 + Math.random() * 1.5;
        const x = Math.random() * w, y = Math.random() * h;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (Math.random() - .5) * 4, y - 2 - Math.random() * 4); ctx.stroke();
    }
    return c;
}

const woodCanvas = createWoodCanvas();
const wallCanvas = createWallCanvas();
const tileCanvas = createTileCanvas();
const metalCanvas = createMetalCanvas();
const fabricCanvas = createFabricCanvas();
const grassCanvas = createGrassCanvas();

// ============================================================

function addBoxCollider(mesh) {
    mesh.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(mesh);
    box.expandByScalar(0.02);
    colliders.push(box);
    return mesh;
}

function makeBox(w, h, d, x, y, z, mat, parent = houseGroup, collide = true, isFloor = false) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    parent.add(m);
    if (collide) addBoxCollider(m);
    if (isFloor) floorMeshes.push(m);
    return m;
}

let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('pointerdown', initAudio, { once: true });
document.addEventListener('keydown', initAudio, { once: true });

function playTone(freq, duration, volume = 0.1, type = 'sine') {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(volume, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + duration);
}

function playDoorSound() {
    // Creak: sweep + noise burst
    playTone(180, 0.15, 0.06, 'sawtooth');
    setTimeout(() => playTone(160, 0.25, 0.04, 'sawtooth'), 60);
    setTimeout(() => playTone(220, 0.08, 0.03, 'triangle'), 200);
}

function playSwitchSound() {
    playTone(1200, 0.03, 0.04, 'square');
    setTimeout(() => playTone(800, 0.05, 0.03, 'square'), 30);
}

function playFootstep() {
    playTone(120 + Math.random() * 40, 0.08, 0.02, 'sine');
}

// ---- WALLS ----
function buildWall(axis, fixed, from, to, baseY, height, openings, opts = {}) {
    openings.sort((a, b) => a.start - b.start);
    let cursor = from;
    const segs = [];
    for (const op of openings) {
        if (op.start > cursor) segs.push({ start: cursor, end: op.start, solid: true });
        segs.push({ ...op, solid: false });
        cursor = op.end;
    }
    if (cursor < to) segs.push({ start: cursor, end: to, solid: true });

    for (const s of segs) {
        const len = s.end - s.start;
        if (len < 0.01) continue;
        const cx = axis === 'x' ? (s.start + s.end) / 2 : fixed;
        const cz = axis === 'x' ? fixed : (s.start + s.end) / 2;
        const w = axis === 'x' ? len : WALL_T;
        const d = axis === 'x' ? WALL_T : len;

        if (s.solid) {
            makeBox(w, height, d, cx, baseY + height / 2, cz, matWall);
        } else {
            if (s.bottom > 0.01) {
                makeBox(w, s.bottom, d, cx, baseY + s.bottom / 2, cz, matWall);
                // Window sill
                if (s.type === 'window') {
                    const sw = axis === 'x' ? len + 0.1 : 0.28;
                    const sd = axis === 'x' ? 0.28 : len + 0.1;
                    makeBox(sw, 0.05, sd, cx, baseY + s.bottom - 0.01, cz, matWhite, houseGroup, false);
                }
            }
            const topH = height - s.top;
            if (topH > 0.01) {
                makeBox(w, topH, d, cx, baseY + s.top + topH / 2, cz, matWall);
            }
            if (s.type === 'window') {
                buildWindow(axis, cx, cz, len, s.bottom, s.top, baseY, fixed);
            }
        }
    }
}

// Detailed window with frame, mullions, glass
function buildWindow(axis, cx, cz, len, bottom, top, baseY, fixed) {
    const gh = top - bottom;
    const gw = len - 0.06;
    const frameT = 0.05;
    const mullionT = 0.035;
    const glassT = 0.02;

    // Glass panes (4 panes: 2x2 grid)
    const hw = gw / 2 - mullionT / 2;
    const hh = gh / 2 - mullionT / 2;
    const panes = [
        [-gw / 4 - mullionT / 4, gh / 4 + mullionT / 4],
        [gw / 4 + mullionT / 4, gh / 4 + mullionT / 4],
        [-gw / 4 - mullionT / 4, -gh / 4 - mullionT / 4],
        [gw / 4 + mullionT / 4, -gh / 4 - mullionT / 4]
    ];

    for (const [ox, oy] of panes) {
        const geo = axis === 'x'
            ? new THREE.BoxGeometry(hw - 0.02, hh - 0.02, glassT)
            : new THREE.BoxGeometry(glassT, hh - 0.02, hw - 0.02);
        const g = new THREE.Mesh(geo, matGlass);
        g.position.set(cx + (axis === 'x' ? ox : 0), baseY + bottom + gh / 2 + oy, cz + (axis === 'z' ? ox : 0));
        houseGroup.add(g);
    }

    // Frame
    const fw = axis === 'x' ? gw : WALL_T + 0.08;
    const fd = axis === 'x' ? WALL_T + 0.08 : gw;
    // Outer frame (aluminum)
    makeBox(fw, frameT, fd, cx, baseY + top, cz, matAluminum, houseGroup, false);
    makeBox(fw, frameT, fd, cx, baseY + bottom, cz, matAluminum, houseGroup, false);
    if (axis === 'x') {
        makeBox(frameT, gh, fd, cx - gw/2, baseY + bottom + gh/2, cz, matAluminum, houseGroup, false);
        makeBox(frameT, gh, fd, cx + gw/2, baseY + bottom + gh/2, cz, matAluminum, houseGroup, false);
        // Mullions
        makeBox(mullionT, gh, fd - 0.02, cx, baseY + bottom + gh/2, cz, matAluminum, houseGroup, false);
        makeBox(gw, mullionT, fd - 0.02, cx, baseY + bottom + gh/2, cz, matAluminum, houseGroup, false);
    } else {
        makeBox(fw, gh, frameT, cx, baseY + bottom + gh/2, cz - gw/2, matAluminum, houseGroup, false);
        makeBox(fw, gh, frameT, cx, baseY + bottom + gh/2, cz + gw/2, matAluminum, houseGroup, false);
        makeBox(fd - 0.02, gh, mullionT, cx, baseY + bottom + gh/2, cz, matAluminum, houseGroup, false);
        makeBox(fd - 0.02, mullionT, gw, cx, baseY + bottom + gh/2, cz, matAluminum, houseGroup, false);
    }
    // Handle
    const handleGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.14, 8);
    const hdl = new THREE.Mesh(handleGeo, matAluminum);
    if (axis === 'x') {
        hdl.position.set(cx + gw/2 - 0.1, baseY + bottom + gh/2, cz + WALL_T/2 + 0.05);
        hdl.rotation.z = Math.PI / 2;
    } else {
        hdl.position.set(cx + WALL_T/2 + 0.05, baseY + bottom + gh/2, cz + gw/2 - 0.1);
        hdl.rotation.x = Math.PI / 2;
    }
    houseGroup.add(hdl);
}

// ---- DOOR with proper hinge pivot ----
function createDoor(x, z, rotationY, width = 0.95, height = 2.1, isExterior = false) {
    const pivot = new THREE.Group();
    pivot.position.set(x, 0, z);
    pivot.rotation.y = rotationY;
    houseGroup.add(pivot);

    // Frame
    const frameMat = matDarkWood;
    const doorGroup = new THREE.Group();
    pivot.add(doorGroup);

    // Panel offset so it rotates around left edge (hinge)
    const panel = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, 0.06),
        isExterior ? matDarkWood : matWhite
    );
    panel.position.set(width / 2, height / 2, 0);
    panel.castShadow = true;
    panel.receiveShadow = true;
    doorGroup.add(panel);

    // Small inner panel (raised)
    const inner = new THREE.Mesh(
        new THREE.BoxGeometry(width * 0.7, height * 0.7, 0.01),
        isExterior ? matDarkWood : matWhite
    );
    inner.position.set(width / 2, height / 2, 0.035);
    doorGroup.add(inner);

    // Handle
    const handleGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.12, 8);
    const handle = new THREE.Mesh(handleGeo, matMetal);
    handle.rotation.z = Math.PI / 2;
    handle.position.set(width - 0.08, height * 0.5, 0.06);
    doorGroup.add(handle);

    // Door collider (static — we don't recalc for animation, use the frame gap)
    addBoxCollider(panel);

    const doorObj = {
        mesh: pivot, type: 'door', open: false, angle: 0,
        targetAngle: 0, group: doorGroup, panel
    };
    interactables.push(doorObj);
    return doorObj;
}

// ---- ROOF ----
function createRoof() {
    const roofGroup = new THREE.Group();
    const overhang = 0.6;
    const roofW = W + overhang * 2;
    const roofD = D + overhang * 2;
    const ridgeH = 1.8;
    const halfD = roofD / 2;
    const slopeLength = Math.hypot(halfD, ridgeH);

    const front = new THREE.Mesh(new THREE.BoxGeometry(roofW, 0.15, slopeLength), matRoof);
    front.position.set(0, ridgeH / 2, -roofD / 4);
    front.rotation.x = -Math.atan2(ridgeH, halfD);
    front.castShadow = true; front.receiveShadow = true;
    roofGroup.add(front);

    const back = new THREE.Mesh(new THREE.BoxGeometry(roofW, 0.15, slopeLength), matRoof);
    back.position.set(0, ridgeH / 2, roofD / 4);
    back.rotation.x = Math.atan2(ridgeH, halfD);
    back.castShadow = true; back.receiveShadow = true;
    roofGroup.add(back);

    // Fascia boards (карнизные планки)
    const fascia = new THREE.BoxGeometry(roofW, 0.12, 0.06);
    for (const z of [-roofD/2, roofD/2]) {
        const f = new THREE.Mesh(fascia, matWhite);
        f.position.set(0, 0.15, z);
        roofGroup.add(f);
    }

    // Gables
    const triShape = new THREE.Shape();
    triShape.moveTo(-roofD/2 + overhang, 0);
    triShape.lineTo(roofD/2 - overhang, 0);
    triShape.lineTo(0, ridgeH);
    triShape.closePath();
    const triGeo = new THREE.ExtrudeGeometry(triShape, { depth: 0.15, bevelEnabled: false });
    const fw = new THREE.Mesh(triGeo, matWall);
    fw.rotation.y = Math.PI / 2; fw.position.set(-W/2, 0, 0);
    fw.castShadow = true;
    roofGroup.add(fw);
    const bw = new THREE.Mesh(triGeo, matWall);
    bw.rotation.y = -Math.PI / 2; bw.position.set(W/2, 0, 0);
    bw.castShadow = true;
    roofGroup.add(bw);

    // Downspouts (водосточные трубы)
    const pipeMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.5, metalness: 0.6 });
    for (const [px, pz] of [[-W/2-0.3, -D/2-0.3], [W/2+0.3, -D/2-0.3], [-W/2-0.3, D/2+0.3], [W/2+0.3, D/2+0.3]]) {
        const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 6, 8), pipeMat);
        pipe.position.set(px, 3, pz);
        pipe.castShadow = true;
        roofGroup.add(pipe);
    }
    // Gutters (желоба)
    for (const z of [-roofD/2 + 0.05, roofD/2 - 0.05]) {
        const gutter = new THREE.Mesh(
            new THREE.CylinderGeometry(0.06, 0.06, roofW, 8, 1, true, 0, Math.PI),
            pipeMat
        );
        gutter.rotation.z = Math.PI / 2;
        gutter.rotation.y = Math.PI / 2;
        gutter.position.set(0, 0.1, z);
        roofGroup.add(gutter);
    }

    roofGroup.position.y = base2 + H;
    return roofGroup;

const roomLights = {}; // roomName -> [light objects]
const lightSwitches = [];

function addRoomLight(roomName, x, y, z, color, intensity) {
    if (!roomLights[roomName]) roomLights[roomName] = [];
    const light = new THREE.PointLight(color, intensity, 8, 2);
    light.position.set(x, y, z);
    light.castShadow = false;
    scene.add(light);

    // Fixture
    const shade = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 12, 8),
        matEmissiveWhite
    );
    shade.position.copy(light.position);
    shade.material = shade.material.clone();
    shade.material.emissiveIntensity = 1.5;
    scene.add(shade);

    roomLights[roomName].push({ light, shade, baseIntensity: intensity, on: true });
    return light;
}

function makeTree(x, z, scale = 1) {
    const tree = new THREE.Group();
    const trunkH = 2.0 * scale;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * scale, 0.28 * scale, trunkH, 8), matBark);
    trunk.position.y = trunkH / 2;

    tree.add(trunk);

    const foliageGeo = new THREE.SphereGeometry(1.3 * scale, 10, 8);
    for (let i = 0; i < 3; i++) {
        const f = new THREE.Mesh(foliageGeo, matLeaves);
        f.position.set((Math.random() - 0.5) * 0.8 * scale,
            trunkH + 0.8 * scale + i * 0.4 * scale,
            (Math.random() - 0.5) * 0.8 * scale);
        f.scale.setScalar(0.7 + Math.random() * 0.4);
        f.castShadow = true;
        tree.add(f);
    }
    tree.position.set(x, 0, z);
    tree.rotation.y = Math.random() * Math.PI * 2;
    scene.add(tree);
}

const CinematicShader = {
    uniforms: {
        tDiffuse: { value: null }, time: { value: 0 },
        resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        vignetteStrength: { value: 0.5 },
        grainStrength: { value: 0.03 },
        chromaticStrength: { value: 0.0015 }
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
        uniform sampler2D tDiffuse; uniform float time; uniform vec2 resolution;
        uniform float vignetteStrength; uniform float grainStrength; uniform float chromaticStrength;
        varying vec2 vUv;
        float rand(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
        void main(){
            vec2 uv=vUv; vec2 dir=uv-0.5; float d=length(dir);
            vec2 off=dir*d*chromaticStrength;
            float r=texture2D(tDiffuse,uv+off).r;
            float g=texture2D(tDiffuse,uv).g;
            float b=texture2D(tDiffuse,uv-off).b;
            vec3 col=vec3(r,g,b);
            float vig=smoothstep(0.95,0.25,d*2.0);
            col*=mix(1.0,vig,vignetteStrength);
            float luma=dot(col,vec3(0.299,0.587,0.114));
            col*=mix(vec3(0.94,0.97,1.06),vec3(1.06,1.02,0.97),smoothstep(0.0,1.0,luma));
            float l2=dot(col,vec3(0.299,0.587,0.114));
            col=mix(vec3(l2),col,1.1);
            float grain=rand(uv*resolution+time*60.0);
            col+=(grain-0.5)*grainStrength;
            gl_FragColor=vec4(col,1.0);
        }
    `
};
const cinematicPass = new ShaderPass(CinematicShader);
composer.addPass(cinematicPass);

    camera.rotation.x = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, camera.rotation.x));
});

document.addEventListener('pointerlockchange', () => {

    document.getElementById('blocker').classList.toggle('hidden', isLocked);
    if (isLocked) hideHint();
});

const blockerEl = document.getElementById('blocker');
const startGame = (e) => {
    e.preventDefault();
    initAudio();
    if (isMobile) {
        blockerEl.classList.add('hidden');
        hideHint();
    } else {
        try {
            const p = renderer.domElement.requestPointerLock();
            if (p && p.catch) p.catch(() => { blockerEl.classList.add('hidden'); hideHint(); });
        } catch (_) {
            blockerEl.classList.add('hidden');
            hideHint();
        }
    }
};

        case 'KeyA': case 'ArrowLeft': keys.a = false; break;

let joyCenter = { x: 0, y: 0 };
const joyVec = new THREE.Vector2(0, 0);
const joyMax = 55;

joyZone.addEventListener('pointerdown', (e) => {
    if (joyActive) return;
    joyActive = true; joyId = e.pointerId;
    joyZone.setPointerCapture(e.pointerId);
    const rect = joyZone.getBoundingClientRect();
    joyCenter.x = rect.left + rect.width / 2;
    joyCenter.y = rect.top + rect.height / 2;
    updateJoy(e);
});
joyZone.addEventListener('pointermove', (e) => {
    if (!joyActive || e.pointerId !== joyId) return;
    updateJoy(e);
});
const endJoy = (e) => {
    if (e.pointerId !== joyId) return;
    joyActive = false; joyId = null;
    joyVec.set(0, 0);
    joyKnob.style.transform = 'translate(0,0)';
    try { joyZone.releasePointerCapture(e.pointerId); } catch(_) {}
};
joyZone.addEventListener('pointerup', endJoy);
joyZone.addEventListener('pointercancel', endJoy);

function updateJoy(e) {
    let dx = e.clientX - joyCenter.x, dy = e.clientY - joyCenter.y;
    const d = Math.hypot(dx, dy);
    if (d > joyMax) { dx = dx / d * joyMax; dy = dy / d * joyMax; }
    joyKnob.style.transform = `translate(${dx}px,${dy}px)`;
    joyVec.set(dx / joyMax, dy / joyMax);
}

let lookId = null, lookLastX = 0, lookLastY = 0;
lookZone.addEventListener('pointerdown', (e) => {
    if (lookId !== null) return;
    lookId = e.pointerId;
    lookLastX = e.clientX; lookLastY = e.clientY;
    lookZone.setPointerCapture(e.pointerId);
});
lookZone.addEventListener('pointermove', (e) => {
    if (e.pointerId !== lookId) return;
    const dx = e.clientX - lookLastX, dy = e.clientY - lookLastY;
    lookLastX = e.clientX; lookLastY = e.clientY;
    player.rotation.y -= dx * TOUCH_SENS;
    camera.rotation.x -= dy * TOUCH_SENS;
    camera.rotation.x = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, camera.rotation.x));
});
const endLook = (e) => {
    if (e.pointerId !== lookId) return;
    lookId = null;
    try { lookZone.releasePointerCapture(e.pointerId); } catch(_) {}
};
lookZone.addEventListener('pointerup', endLook);
lookZone.addEventListener('pointercancel', endLook);

btnJump.addEventListener('pointerdown', (e) => {
    e.preventDefault(); jumpRequested = true;
    btnJump.classList.add('pressed');
    if (navigator.vibrate) navigator.vibrate(15);
});
btnJump.addEventListener('pointerup', () => btnJump.classList.remove('pressed'));

let mobileRunning = false;
btnRun.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    mobileRunning = !mobileRunning;
    btnRun.classList.toggle('active', mobileRunning);
});
btnUse.addEventListener('pointerdown', (e) => {
    e.preventDefault(); interact();
    if (navigator.vibrate) navigator.vibrate(20);
});

// ============================================================
// 15. PHYSICS (raycast floors + AABB walls + step-up)
// ============================================================
const GRAVITY = 20;
const WALK_SPEED = 3.5;
const RUN_SPEED = 6.5;
const JUMP_POWER = 6.5;
const STEP_HEIGHT = 0.35; // max auto-step

const velocity = new THREE.Vector3();
let onGround = false;

const floorRaycaster = new THREE.Raycaster();

function getFloorY(x, z, fromY) {
    floorRaycaster.set(new THREE.Vector3(x, fromY, z), new THREE.Vector3(0, -1, 0));
    floorRaycaster.far = 30;
    const hits = floorRaycaster.intersectObjects(floorMeshes, false);
    if (hits.length > 0) return hits[0].point.y;
    return -1;
}

function checkWallCollision(x, z, playerY) {
    const feet = playerY - PLAYER_HEIGHT;
    const head = playerY;
    for (const box of colliders) {
        if (x + PLAYER_RADIUS > box.min.x && x - PLAYER_RADIUS < box.max.x &&
            z + PLAYER_RADIUS > box.min.z && z - PLAYER_RADIUS < box.max.z) {
            // Only collide if the box top is significantly above feet (i.e. it's a wall)
            // AND the box bottom is below head (it's in the way)
            if (box.max.y > feet + STEP_HEIGHT && box.min.y < head - 0.05) {
                return true;
            }
        }
    }
    return false;
}

function movePlayer(dx, dz) {
    const py = player.position.y;
    if (!checkWallCollision(player.position.x + dx, player.position.z, py)) {
        player.position.x += dx;
    }
    if (!checkWallCollision(player.position.x, player.position.z + dz, py)) {
        player.position.z += dz;
    }
}

// ============================================================
// 16. INTERACTION
// ============================================================
const crosshairEl = document.getElementById('crosshair');
const interactPromptEl = document.getElementById('interact-prompt');
const raycaster = new THREE.Raycaster();
const interactRay = new THREE.Vector2(0, 0);
let currentInteractable = null;

function findInteractable() {
    raycaster.setFromCamera(interactRay, camera);
    raycaster.far = 3.0;
    const list = [];
    for (const it of interactables) {
        it.mesh.traverse(c => { if (c.isMesh) list.push(c); });
    }
    const hits = raycaster.intersectObjects(list, false);
    if (hits.length === 0) return null;
    let obj = hits[0].object;
    while (obj && !interactables.find(i => i.mesh === obj || i.mesh === obj.parent)) {
        obj = obj.parent;
    }
    return interactables.find(i => i.mesh === obj || i.mesh === obj?.parent) || null;
}

function interact() {
    const target = currentInteractable;
    if (!target) return;

    if (target.type === 'door' || target.type === 'gate' || target.type === 'fridge' || target.type === 'mailbox') {
        target.open = !target.open;
        target.targetAngle = target.open ? (target.type === 'fridge' ? -Math.PI * 0.6 : -Math.PI / 2) : 0;
        playDoorSound();
        if (navigator.vibrate) navigator.vibrate(30);
    } else if (target.type === 'switch') {
        target.on = !target.on;
        target.toggle.material = target.on ? matSwitchOn.clone() : matSwitchOff.clone();
        const lights = roomLights[target.roomName] || [];
        for (const l of lights) {
            l.on = target.on;
            if (target.on) l.light.intensity = l.baseIntensity;
            else l.light.intensity = 0;
            l.shade.material.emissiveIntensity = target.on ? 1.5 : 0.05;
        }
        playSwitchSound();
    } else if (target.type === 'tv') {
        target.on = !target.on;
        if (target.on) {
            target.light.intensity = 0.6;
            target.screen.emissiveIntensity = 0.35;
        } else {
            target.light.intensity = 0;
            target.screen.emissiveIntensity = 0;
        }
        playSwitchSound();
    }
}

function updateInteractables(delta) {
    for (const it of interactables) {
        if (it.type === 'door' || it.type === 'gate' || it.type === 'fridge' || it.type === 'mailbox') {
            it.angle += (it.targetAngle - it.angle) * Math.min(1, delta * 8);
            it.mesh.rotation.y = it.angle;
        }
    }
}

// ============================================================
// 17. ANIMATION LOOP
// ============================================================
const clock = new THREE.Clock();
let elapsed = 0;
const fpsEl = document.getElementById('fps');
let fpsAccum = 0, fpsFrames = 0;

let lastFootstep = 0;
let isMoving = false;

function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.05);
    elapsed += delta;

    // ---- Movement ----
    let moveX = 0, moveZ = 0, wantRun = false;
    if (isMobile) {
        moveX = joyVec.x;
        moveZ = joyVec.y;
        wantRun = mobileRunning;
    }
    if (isLocked) {
        if (keys.w) moveZ -= 1;
        if (keys.s) moveZ += 1;
        if (keys.a) moveX -= 1;
        if (keys.d) moveX += 1;
        wantRun = keys.shift;
    }
    const moveLen = Math.hypot(moveX, moveZ);
    if (moveLen > 1) { moveX /= moveLen; moveZ /= moveLen; }

    const yaw = player.rotation.y;
    const sinY = Math.sin(yaw), cosY = Math.cos(yaw);
    const speed = wantRun ? RUN_SPEED : WALK_SPEED;
    const wdx = (moveX * cosY - moveZ * sinY) * speed * delta;
    const wdz = (moveX * sinY + moveZ * cosY) * speed * delta;

    isMoving = moveLen > 0.05;
    if (isMoving) {
        movePlayer(wdx, wdz);
        hideHint();
        // Footstep sound
        if (elapsed - lastFootstep > 0.4) {
            playFootstep();
            lastFootstep = elapsed;
        }
    }

    // ---- Jump / Gravity ----
    if (jumpRequested && onGround) {
        velocity.y = JUMP_POWER;
        onGround = false;
    }
    jumpRequested = false;

    velocity.y -= GRAVITY * delta;
    player.position.y += velocity.y * delta;

    // Detect floor below player (cast from slightly above head)
    const floorY = getFloorY(player.position.x, player.position.z, player.position.y + 0.5);
    const feetTarget = floorY + PLAYER_HEIGHT;

    if (floorY > -0.5) {
        if (velocity.y <= 0) {
            // Standing or falling
            if (player.position.y <= feetTarget + 0.01) {
                player.position.y = feetTarget;
                velocity.y = 0;
                onGround = true;
            } else if (player.position.y <= feetTarget + STEP_HEIGHT && onGround) {
                // Step up small ledge
                player.position.y = feetTarget;
                velocity.y = 0;
                onGround = true;
            } else {
                onGround = false;
            }
        } else {
            onGround = false;
        }
    }

    if (player.position.y > 20) { player.position.y = 20; velocity.y = 0; }
    if (player.position.y < -5) { player.position.set(0, PLAYER_HEIGHT + 0.01, 14); velocity.y = 0; }

    // ---- Interaction ----
    updateInteractables(delta);
    currentInteractable = findInteractable();

    const cr = document.getElementById('crosshair');
    if (currentInteractable) {
        cr.classList.add('active');
        interactPromptEl.classList.add('visible');
        interactPromptEl.textContent = isMobile ? 'Использовать' : 'Нажмите E';
        btnUse.classList.add('available');
    } else {
        cr.classList.remove('active');
        interactPromptEl.classList.remove('visible');
        btnUse.classList.remove('available');
    }

    // ---- Post-processing uniforms ----
    cinematicPass.uniforms.time.value = elapsed;

    // ---- FPS ----
    fpsAccum += delta; fpsFrames++;
    if (fpsAccum >= 0.5) {
        fpsEl.textContent = Math.round(fpsFrames / fpsAccum) + ' FPS';
        fpsAccum = 0; fpsFrames = 0;
    }

    composer.render();
}

// ============================================================
// 18. RESIZE
// ============================================================
function onResize() {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
    cinematicPass.uniforms.resolution.value.set(w, h);
    if (smaaPass) smaaPass.setSize(w * QUALITY.pixelRatio, h * QUALITY.pixelRatio);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

// ============================================================
// 19. START
// ============================================================
const hintEl = document.getElementById('hint');
let hintHidden = false;
function hideHint() {
    if (hintHidden) return;
    hintHidden = true;
    hintEl.classList.add('hidden');
    setTimeout(() => hintEl.style.display = 'none', 700);
}

document.getElementById('loading-bar').style.width = '100%';
setTimeout(() => {
    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => document.getElementById('loading').style.display = 'none', 400);
}, 500);

player.rotation.y = Math.PI;
animate();
setTimeout(hideHint, 8000);

console.log('%c Modern House 3D — Refactored ', 'background:#4a7fff;color:#fff;padding:4px 12px;border-radius:4px;font-weight:bold;');
console.log('Floors:', floorMeshes.length, '| Walls:', colliders.length, '| Interactables:', interactables.length);
</script>
