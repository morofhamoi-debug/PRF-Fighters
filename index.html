<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ночной особняк</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05060a; font-family: 'Courier New', monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #canvas { display: block; width: 100%; height: 100%; outline: none; }

  #loading {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    background: #05060a; color: #7a8fa5; font-size: 14px; letter-spacing: 4px;
    transition: opacity 0.8s; font-family: 'Courier New', monospace;
    text-transform: uppercase;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }

  #error {
    position: fixed; inset: 0; z-index: 1100;
    display: none; align-items: center; justify-content: center;
    background: #1a0505; color: #ffbdbd; font-size: 14px; padding: 24px; text-align: center;
    line-height: 1.6;
  }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 80%, rgba(0,0,0,0.85) 100%);
  }

  #grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    opacity: 0.08; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.9'/></svg>");
    animation: grainShift 0.9s steps(3) infinite;
  }
  @keyframes grainShift {
    0% { transform: translate(0,0); }
    33% { transform: translate(-2%,1%); }
    66% { transform: translate(1%,-2%); }
    100% { transform: translate(0,0); }
  }

  #crosshair {
    position: fixed; top: 50%; left: 50%;
    width: 4px; height: 4px; margin: -2px 0 0 -2px;
    background: rgba(200,180,150,0.45);
    border-radius: 50%; pointer-events: none; z-index: 5;
    box-shadow: 0 0 4px rgba(0,0,0,0.9);
    transition: opacity 0.3s;
  }

  #hint {
    position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%); z-index: 9;
    color: rgba(190,175,150,0.85); font-size: 11px;
    background: rgba(0,0,0,0.55); padding: 7px 14px;
    border-radius: 3px; letter-spacing: 1.2px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(140,110,80,0.25);
    transition: opacity 0.6s; pointer-events: none;
    white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
  }
  #hint.hidden { opacity: 0; }

  #menu-btn {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    width: 46px; height: 46px;
    border-radius: 4px;
    background: linear-gradient(135deg, rgba(20,12,10,0.75), rgba(8,5,4,0.9));
    border: 1px solid rgba(120,85,60,0.4);
    color: #b69a7c;
    font-size: 20px; line-height: 1;
    z-index: 40;
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.6), inset 0 0 12px rgba(0,0,0,0.4);
  }
  #menu-btn:active, #menu-btn.active {
    transform: scale(0.93);
    background: linear-gradient(135deg, rgba(40,20,15,0.9), rgba(15,8,5,0.95));
    box-shadow: 0 0 18px rgba(160,40,20,0.35), inset 0 0 12px rgba(0,0,0,0.6);
  }

  #flashlight-btn {
    position: fixed;
    bottom: max(30px, env(safe-area-inset-bottom));
    right: max(28px, env(safe-area-inset-right));
    width: 62px; height: 62px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(60,45,30,0.7), rgba(10,8,6,0.9));
    border: 2px solid rgba(150,110,70,0.45);
    color: #d0b088;
    font-size: 24px; line-height: 1;
    z-index: 30;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.7), inset 0 0 10px rgba(0,0,0,0.5);
    -webkit-user-select: none;
    user-select: none;
  }
  #flashlight-btn.on {
    background: radial-gradient(circle at 40% 35%, rgba(255,225,150,0.85), rgba(200,150,60,0.6));
    border-color: rgba(255,220,140,0.85);
    color: #2a1808;
    box-shadow: 0 0 28px rgba(255,210,120,0.6), 0 4px 14px rgba(0,0,0,0.7);
  }
  #flashlight-btn:active { transform: scale(0.94); }

  #menu-panel {
    position: fixed;
    top: max(66px, calc(env(safe-area-inset-top) + 58px));
    right: max(12px, env(safe-area-inset-right));
    width: min(300px, calc(100vw - 24px));
    background: linear-gradient(180deg, rgba(15,10,8,0.92), rgba(8,5,4,0.95));
    border: 1px solid rgba(120,85,60,0.35);
    border-radius: 4px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: #c0a888;
    z-index: 39;
    padding: 16px;
    display: none;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 10px 36px rgba(0,0,0,0.75), inset 0 0 20px rgba(0,0,0,0.5);
    font-size: 13px;
    transform-origin: top right;
    animation: menuIn 0.18s ease-out;
    font-family: 'Courier New', monospace;
  }
  @keyframes menuIn {
    from { opacity: 0; transform: scale(0.94) translateY(-6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  #menu-panel.open { display: flex; }

  .menu-section h3 {
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: #8b7255; margin-bottom: 8px; font-weight: 700;
    border-bottom: 1px solid rgba(120,85,60,0.25);
    padding-bottom: 6px;
  }
  #menu-panel label {
    display: block; font-size: 11px; margin-bottom: 5px; color: #a08865; letter-spacing: 1px;
  }
  #menu-panel select {
    width: 100%; padding: 9px 10px; font-size: 12px;
    background: rgba(0,0,0,0.6); color: #c0a888;
    border: 1px solid rgba(120,85,60,0.4); border-radius: 2px;
    outline: none; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, rgba(180,140,90,0.7) 50%),
                      linear-gradient(135deg, rgba(180,140,90,0.7) 50%, transparent 50%);
    background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 30px;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
  }
  #menu-panel select option { background: #0a0806; color: #c0a888; }

  .fps-buttons { display: flex; gap: 6px; }
  .fps-buttons button {
    flex: 1; padding: 9px 4px; font-size: 11px;
    background: rgba(0,0,0,0.5); color: #c0a888;
    border: 1px solid rgba(120,85,60,0.35); border-radius: 2px;
    cursor: pointer; transition: all 0.15s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    font-weight: 500; letter-spacing: 1px;
    outline: none; font-family: 'Courier New', monospace;
  }
  .fps-buttons button:active { transform: scale(0.96); }
  .fps-buttons button.active {
    background: linear-gradient(180deg, rgba(120,40,20,0.5), rgba(60,15,8,0.7));
    border-color: rgba(190,90,40,0.75);
    color: #ffd0b0;
    box-shadow: 0 0 14px rgba(200,70,30,0.35), inset 0 0 8px rgba(255,120,60,0.15);
  }

  .fps-indicator {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid rgba(120,85,60,0.2);
    font-size: 11px; color: #8b7255;
    display: flex; justify-content: space-between;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }
  #fps-value {
    color: #d0a070; font-weight: 700;
    text-shadow: 0 0 8px rgba(200,120,50,0.5);
  }

  #joystick {
    position: fixed;
    bottom: max(28px, env(safe-area-inset-bottom));
    left: max(28px, env(safe-area-inset-left));
    width: 130px; height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(30,20,15,0.35), rgba(5,3,2,0.55));
    border: 1.5px solid rgba(140,100,60,0.32);
    z-index: 20; display: none; touch-action: none;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.5);
  }
  /* ИСПРАВЛЕНО: убран margin, центрирование через transform */
  #knob {
    position: absolute; top: 50%; left: 50%;
    width: 56px; height: 56px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 30%, rgba(140,100,65,0.55), rgba(30,20,12,0.85));
    border: 1.5px solid rgba(180,130,80,0.45);
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 2px 12px rgba(0,0,0,0.6), inset 0 0 10px rgba(0,0,0,0.5);
    transition: transform 0.06s linear;
  }
  #lookzone {
    position: fixed; top: 0; right: 0;
    width: 62%; height: 100%;
    z-index: 15; display: none; touch-action: none;
  }

  @media (max-aspect-ratio: 3/4) {
    #hint { font-size: 10px; padding: 6px 12px; }
    #menu-panel { width: min(280px, calc(100vw - 24px)); }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="vignette"></div>
<div id="grain"></div>
<div id="crosshair"></div>

<button id="menu-btn" aria-label="Меню" type="button">&#9776;</button>
<button id="flashlight-btn" aria-label="Фонарик" type="button">&#128294;</button>

<div id="menu-panel" role="dialog" aria-label="Настройки">
  <div class="menu-section">
    <h3>Графика</h3>
    <label for="quality-select">Качество</label>
    <select id="quality-select">
      <option value="low">Низкое</option>
      <option value="medium">Среднее</option>
      <option value="high">Высокое</option>
      <option value="ultra">Ультра</option>
    </select>
  </div>

  <div class="menu-section">
    <h3>Частота кадров</h3>
    <div class="fps-buttons" id="fps-buttons">
      <button type="button" data-fps="30">30 FPS</button>
      <button type="button" data-fps="60">60 FPS</button>
      <button type="button" data-fps="120">120 FPS</button>
    </div>
    <div class="fps-indicator">
      <span>Цель: <span id="fps-target">60</span></span>
      <span>Реально: <span id="fps-value">--</span></span>
    </div>
  </div>
</div>

<div id="joystick"><div id="knob"></div></div>
<div id="lookzone"></div>
<div id="hint">Клик — захват · WASD — идти · Shift — бег · F — фонарик · Esc — выход</div>
<div id="loading">Загрузка особняка…</div>
<div id="error"></div>

<script>
  window.__gameStarted = false;
  setTimeout(function () {
    if (!window.__gameStarted) {
      var el = document.getElementById('error');
      el.style.display = 'flex';
      el.innerHTML = 'Не удалось загрузить Three.js.<br>Проверьте подключение к интернету и обновите страницу.';
      var ld = document.getElementById('loading');
      if (ld) ld.style.display = 'none';
    }
  }, 12000);
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
window.__gameStarted = true;

/* ============================================================
   ======================= BASIC SETUP ========================
   ============================================================ */
const canvas = document.getElementById('canvas');
const loadingEl = document.getElementById('loading');
const errorEl = document.getElementById('error');

let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    powerPreference: 'high-performance',
    stencil: false,
    depth: true
  });
} catch (e) {
  errorEl.style.display = 'flex';
  errorEl.textContent = 'WebGL не поддерживается.';
  loadingEl.style.display = 'none';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);
scene.fog = new THREE.FogExp2(0x0a1018, 0.032);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 800);
camera.position.set(0, 1.65, 6);
scene.add(camera);

/* ---------- Quality presets ---------- */
const QUALITY_PRESETS = {
  low:    { grass: 18000,  grassRadius: 32, grassDist: 34,  pixel: 1 },
  medium: { grass: 45000,  grassRadius: 42, grassDist: 46,  pixel: 1.5 },
  high:   { grass: 90000,  grassRadius: 55, grassDist: 60,  pixel: 2 },
  ultra:  { grass: 160000, grassRadius: 68, grassDist: 75,  pixel: 2 }
};

function detectQuality() {
  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                   (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  const mem = navigator.deviceMemory || 4;
  const cores = navigator.hardwareConcurrency || 4;
  if (isMobile) return (cores >= 8 && mem >= 6) ? 'medium' : 'low';
  if (cores >= 8 && mem >= 8) return 'high';
  return 'medium';
}

let currentQuality = detectQuality();
let preset = QUALITY_PRESETS[currentQuality];
let userOverrodeQuality = false;

/* ============================================================
   ====================== UTILS / TEXTURES ====================
   ============================================================ */
function makeCanvasTexture(size, drawFn, repeat = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  drawFn(ctx, size);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

/* Dark peeling wood siding */
const woodSidingTex = makeCanvasTexture(512, (ctx, s) => {
  ctx.fillStyle = '#2a1f16';
  ctx.fillRect(0, 0, s, s);
  const plankH = s / 10;
  for (let i = 0; i < 10; i++) {
    const y = i * plankH;
    const shade = 0.7 + Math.random() * 0.5;
    const r = Math.floor(52 * shade);
    const g = Math.floor(36 * shade);
    const b = Math.floor(22 * shade);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, y, s, plankH - 1);
    for (let g2 = 0; g2 < 30; g2++) {
      ctx.strokeStyle = `rgba(0,0,0,${Math.random() * 0.22})`;
      ctx.lineWidth = 0.5 + Math.random();
      ctx.beginPath();
      const y0 = y + Math.random() * plankH;
      ctx.moveTo(0, y0);
      for (let x = 0; x <= s; x += 12) {
        ctx.lineTo(x, y0 + (Math.random() - 0.5) * 2);
      }
      ctx.stroke();
    }
    const patches = 3 + Math.floor(Math.random() * 5);
    for (let p = 0; p < patches; p++) {
      ctx.fillStyle = `rgba(150,140,120,${Math.random() * 0.15})`;
      const px = Math.random() * s;
      const py = y + Math.random() * plankH;
      const pw = 5 + Math.random() * 25;
      const ph = 3 + Math.random() * 10;
      ctx.fillRect(px, py, pw, ph);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, y + plankH - 2, s, 2);
  }
  for (let i = 0; i < 4000; i++) {
    ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.3})`;
    ctx.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
}, 3);

/* Cracked brick foundation */
const brickTex = makeCanvasTexture(512, (ctx, s) => {
  ctx.fillStyle = '#1a0e08';
  ctx.fillRect(0, 0, s, s);
  const rows = 12, cols = 8;
  const bh = s / rows, bw = s / cols;
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) ? bw / 2 : 0;
    for (let c = -1; c < cols + 1; c++) {
      const x = c * bw + off;
      const y = r * bh;
      const v = 0.7 + Math.random() * 0.5;
      const rr = Math.floor(90 * v);
      const gg = Math.floor(50 * v);
      const bb = Math.floor(35 * v);
      ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
      ctx.fillRect(x + 1, y + 1, bw - 2, bh - 2);
      for (let k = 0; k < 8; k++) {
        ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.4})`;
        ctx.fillRect(x + Math.random() * bw, y + Math.random() * bh, 1, 1);
      }
    }
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 1;
  for (let r = 0; r <= rows; r++) {
    ctx.beginPath(); ctx.moveTo(0, r * bh); ctx.lineTo(s, r * bh); ctx.stroke();
  }
}, 4);

/* Dark roof shingles */
const shingleTex = makeCanvasTexture(512, (ctx, s) => {
  ctx.fillStyle = '#0e0a08';
  ctx.fillRect(0, 0, s, s);
  const rows = 20, cols = 10;
  const sh = s / rows, sw = s / cols;
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) ? sw / 2 : 0;
    for (let c = -1; c < cols + 1; c++) {
      const x = c * sw + off;
      const y = r * sh;
      const v = 0.6 + Math.random() * 0.6;
      const rr = Math.floor(38 * v);
      const gg = Math.floor(34 * v);
      const bb = Math.floor(28 * v);
      ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
      ctx.fillRect(x + 0.5, y + 0.5, sw - 1, sh - 1);
    }
  }
}, 5);

/* Aged wallpaper */
const wallpaperTex = makeCanvasTexture(512, (ctx, s) => {
  ctx.fillStyle = '#3a2a1e';
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * s;
    const y = Math.random() * s;
    ctx.fillStyle = `rgba(120,90,60,${0.15 + Math.random() * 0.2})`;
    ctx.beginPath();
    ctx.arc(x, y, 4 + Math.random() * 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(60,40,25,${0.2 + Math.random() * 0.3})`;
    ctx.beginPath();
    ctx.arc(x + 3, y + 3, 2 + Math.random() * 4, 0, Math.PI * 2);
    ctx.fill();
  }
  for (let i = 0; i < 25; i++) {
    const x = Math.random() * s;
    const y = Math.random() * s;
    const rad = 20 + Math.random() * 60;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, rad);
    grad.addColorStop(0, 'rgba(60,40,20,0.35)');
    grad.addColorStop(0.6, 'rgba(40,25,10,0.15)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
  }
  for (let i = 0; i < 40; i++) {
    ctx.strokeStyle = `rgba(0,0,0,${0.3 + Math.random() * 0.4})`;
    ctx.lineWidth = 0.5 + Math.random() * 1.5;
    ctx.beginPath();
    const x = Math.random() * s, y = Math.random() * s;
    ctx.moveTo(x, y);
    for (let k = 0; k < 8; k++) {
      ctx.lineTo(x + (Math.random() - 0.5) * 40, y + (Math.random() - 0.5) * 40);
    }
    ctx.stroke();
  }
}, 3);

/* Rotting wood floor */
const woodFloorTex = makeCanvasTexture(512, (ctx, s) => {
  ctx.fillStyle = '#1a120a';
  ctx.fillRect(0, 0, s, s);
  const plankW = s / 8;
  for (let i = 0; i < 8; i++) {
    const x = i * plankW;
    const v = 0.7 + Math.random() * 0.4;
    ctx.fillStyle = `rgb(${Math.floor(40 * v)},${Math.floor(28 * v)},${Math.floor(18 * v)})`;
    ctx.fillRect(x + 1, 0, plankW - 2, s);
    for (let k = 0; k < 40; k++) {
      ctx.strokeStyle = `rgba(0,0,0,${Math.random() * 0.3})`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      const y0 = Math.random() * s;
      ctx.moveTo(x, y0);
      ctx.lineTo(x + plankW, y0 + (Math.random() - 0.5) * 6);
      ctx.stroke();
    }
  }
  for (let i = 0; i < 12; i++) {
    const x = Math.random() * s;
    const y = Math.random() * s;
    const rad = 15 + Math.random() * 40;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, rad);
    grad.addColorStop(0, 'rgba(70,10,5,0.55)');

function hash2(x, y) {
  const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
  return n - Math.floor(n);
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi);
  const b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1);
  const d = hash2(xi + 1, yi + 1);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}
function fbm2(x, y) {
  let v = 0, a = 0.5;
  for (let i = 0; i < 4; i++) {
    v += a * vnoise(x, y);
    x = x * 2.03 + 7.3;
    y = y * 2.07 - 3.1;
    a *= 0.5;
  }
  return v;
}
function terrainHeight(x, z) {
  let h = 0;
  h += (fbm2(x * 0.02, z * 0.02) - 0.5) * 2.6;
  h += (fbm2(x * 0.09, z * 0.09) - 0.5) * 0.55;
  h += (vnoise(x * 0.4, z * 0.4) - 0.5) * 0.12;
  return h;
}
function flattenAroundHouse(x, z) {
  const houseX = 0, houseZ = -25;
  const dx = Math.abs(x - houseX);
  const dz = Math.abs(z - houseZ);
  const fx = Math.max(0, 1 - dx / 18);
  const fz = Math.max(0, 1 - dz / 16);
  const blend = Math.min(fx, fz);
  if (blend > 0.001) {
    return terrainHeight(x, z) * (1 - blend * 0.85);
  }
  return terrainHeight(x, z);
}

}

  uSunDir:     { value: MOON_DIR.clone() },

  uAmbientSky: { value: new THREE.Color(0.10, 0.13, 0.20) },
  uAmbientGnd: { value: new THREE.Color(0.02, 0.02, 0.03) },
  uFogColor:   { value: new THREE.Color(0x0a1018) },
  uFogDensity: { value: 0.032 },
  uCameraPos:  { value: new THREE.Vector3() },
  uRenderDist: { value: preset.grassDist }
};

function createBladeGeometry(segments) {
  const positions = [], normals = [], uvs = [], indices = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const y = t;
    const w = (1.0 - t * 0.92) * 0.5;
    const droop = t * t * 0.35;
    positions.push(-w, y, droop);
    normals.push(0, 1, 0);
    uvs.push(0, t);
    positions.push(w, y, droop);
    normals.push(0, 1, 0);
    uvs.push(1, t);
  }
  for (let i = 0; i < segments; i++) {
    const a = i * 2;
    indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(normals, 3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  return g;
}

const grassMat = new THREE.ShaderMaterial({
  uniforms: grassUniforms,
  side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    precision highp float;
    attribute vec3 aOffset;
    attribute float aRotation;
    attribute vec2 aScale;
    attribute vec3 aColor;
    attribute float aPhase;
    attribute float aStiffness;
    attribute vec2 aTilt;

    uniform float uTime;
    uniform vec2 uWindDir;
    uniform float uWindStrength;
    uniform vec3 uCameraPos;
    uniform float uRenderDist;

    varying vec3 vColor;
    varying float vHeight;
    varying vec3 vWorldPos;
    varying float vDist;

    void main(){
      float hFrac = position.y;
      vec3 p = position;
      p.x *= aScale.x;
      p.y *= aScale.y;
      p.z *= aScale.x;

      p.x += aTilt.x * hFrac * hFrac * aScale.y * 0.5;
      p.z += aTilt.y * hFrac * hFrac * aScale.y * 0.5;

      float cs = cos(aRotation);
      float sn = sin(aRotation);
      vec3 r = vec3(p.x * cs - p.z * sn, p.y, p.x * sn + p.z * cs);
      vec3 worldPos = r + aOffset;

      float t = uTime * 1.5 + aPhase;
      float wave = sin(worldPos.x * 0.35 + worldPos.z * 0.28 + t);
      float gust = 0.7 + 0.4 * sin(uTime * 0.3 + worldPos.x * 0.04);
      float amt = uWindStrength * gust * (0.5 + 0.5 * wave) * aStiffness;
      float bend = hFrac * hFrac;
      worldPos.x += uWindDir.x * amt * bend;
      worldPos.z += uWindDir.y * amt * bend;

      worldPos.x += sin(t * 1.27 + aPhase * 2.1) * 0.07 * bend;
      worldPos.z += cos(t * 1.13 + aPhase * 1.7) * 0.07 * bend;

      vec2 toP = worldPos.xz - uCameraPos.xz;
      float dP = length(toP);
      if (dP < 1.4 && dP > 0.0005) {
        float push = (1.0 - dP / 1.4);
        push = push * push;
        worldPos.xz += normalize(toP) * push * 0.9 * bend;
      }

      vWorldPos = worldPos;
      vColor = aColor;
      vHeight = hFrac;
      float dist = length(worldPos - uCameraPos);
      vDist = dist;
      if (dist > uRenderDist) {
        gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
        return;
      }
      gl_Position = projectionMatrix * viewMatrix * vec4(worldPos, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec3 vColor;
    varying float vHeight;
    varying vec3 vWorldPos;
    varying float vDist;

    uniform vec3 uSunDir, uSunColor, uAmbientSky, uAmbientGnd, uFogColor;
    uniform float uFogDensity;
    uniform vec3 uCameraPos;

    void main(){
      vec3 col = vColor * mix(0.42, 1.10, vHeight);
      vec3 N = normalize(vec3(0.0, 1.0, 0.0));
      float ndl = max(dot(N, uSunDir), 0.0);
      float skyMix = 0.5 + 0.5 * N.y;
      vec3 ambient = mix(uAmbientGnd, uAmbientSky, skyMix);
      vec3 lit = col * (uSunColor * ndl * 0.9 + ambient * 1.1);
      lit *= mix(0.55, 1.0, smoothstep(0.0, 0.35, vHeight));

      float d = vDist;
      float fogF = 1.0 - exp(-uFogDensity * uFogDensity * d * d);
      lit = mix(lit, uFogColor, fogF);
      gl_FragColor = vec4(lit, 1.0);
    }
  `
});

function buildGrass() {
  if (grassMesh) {
    scene.remove(grassMesh);
    grassMesh.geometry.dispose();
    grassMesh = null;
  }
  const segs = 5;
  const count = preset.grass;
  const radius = preset.grassRadius;

  const base = createBladeGeometry(segs);
  const geo = new THREE.InstancedBufferGeometry();
  geo.index = base.index;
  geo.attributes.position = base.attributes.position;
  geo.attributes.normal = base.attributes.normal;
  geo.attributes.uv = base.attributes.uv;

  const offsets = new Float32Array(count * 3);
  const rotations = new Float32Array(count);
  const scales = new Float32Array(count * 2);
  const colors = new Float32Array(count * 3);
  const phases = new Float32Array(count);
  const stiffness = new Float32Array(count);
  const tilts = new Float32Array(count * 2);
  const tmp = new THREE.Color();

  const HX0 = -11, HX1 = 11, HZ0 = -33, HZ1 = -17;

  let placed = 0;
  let attempts = 0;
  while (placed < count && attempts < count * 4) {
    attempts++;
    const u = Math.random();
    const r = radius * Math.pow(u, 0.7);
    const theta = Math.random() * Math.PI * 2;
    const x = Math.cos(theta) * r;
    const z = Math.sin(theta) * r;

    if (x > HX0 - 1 && x < HX1 + 1 && z > HZ0 - 1 && z < HZ1 + 1) continue;

    const i = placed++;
    const gy = flattenAroundHouse(x, z);
    offsets[i * 3] = x;
    offsets[i * 3 + 1] = gy - 0.04;
    offsets[i * 3 + 2] = z;

    rotations[i] = Math.random() * Math.PI * 2;

    const patch = fbm2(x * 0.08 + 3.1, z * 0.08 - 4.7);
    const heightBase = 0.45 + patch * 0.85;
    const h = heightBase * (0.55 + Math.random() * 0.85);
    const w = (0.018 + Math.random() * 0.026) * (0.8 + patch * 0.5);
    scales[i * 2] = w;
    scales[i * 2 + 1] = h;

    const patchHue = fbm2(x * 0.12 - 8.2, z * 0.12 + 5.6);
    const hue = 0.10 + patchHue * 0.09 + (Math.random() - 0.5) * 0.015;
    const sat = 0.18 + Math.random() * 0.30;
    const lig = 0.08 + Math.random() * 0.12;
    tmp.setHSL(hue, sat, lig);
    colors[i * 3] = tmp.r;
    colors[i * 3 + 1] = tmp.g;
    colors[i * 3 + 2] = tmp.b;

    phases[i] = Math.random() * Math.PI * 2;
    stiffness[i] = 0.5 + Math.random() * 0.8;

    const lean = 0.8 + Math.random() * 0.9;
    const leanAng = Math.random() * Math.PI * 2;
    tilts[i * 2] = Math.cos(leanAng) * lean;
    tilts[i * 2 + 1] = Math.sin(leanAng) * lean;
  }

  geo.setAttribute('aOffset', new THREE.InstancedBufferAttribute(offsets, 3));
  geo.setAttribute('aRotation', new THREE.InstancedBufferAttribute(rotations, 1));
  geo.setAttribute('aScale', new THREE.InstancedBufferAttribute(scales, 2));
  geo.setAttribute('aColor', new THREE.InstancedBufferAttribute(colors, 3));
  geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phases, 1));
  geo.setAttribute('aStiffness', new THREE.InstancedBufferAttribute(stiffness, 1));
  geo.setAttribute('aTilt', new THREE.InstancedBufferAttribute(tilts, 2));
  geo.instanceCount = placed;
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), radius + 5);

  grassMesh = new THREE.Mesh(geo, grassMat);
  grassMesh.frustumCulled = false;
  scene.add(grassMesh);
}

function box(w, h, d, x, y, z, mat, parent = houseGroup, collide = true) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(g, mat);
  m.position.set(x, y, z);
  parent.add(m);
  if (collide) {
    addColliderBox(x - w/2, y - h/2, z - d/2, x + w/2, y + h/2, z + d/2);
  }
  return m;
}

function wallSegmentX(parent, x1, x2, z, y0, y1, thickness, mat, collide = true) {
  if (x2 <= x1) return;
  const w = x2 - x1;
  const h = y1 - y0;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, thickness), mat);
  m.position.set((x1 + x2) / 2, y0 + h / 2, z);
  parent.add(m);
  if (collide) {
    addColliderBox((x1 + x2)/2 - w/2, y0, z - thickness/2, (x1 + x2)/2 + w/2, y1, z + thickness/2);
  }
  return m;
}
function wallSegmentZ(parent, z1, z2, x, y0, y1, thickness, mat, collide = true) {
  if (z2 <= z1) return;
  const d = z2 - z1;
  const h = y1 - y0;
  const m = new THREE.Mesh(new THREE.BoxGeometry(thickness, h, d), mat);
  m.position.set(x, y0 + h / 2, (z1 + z2) / 2);
  parent.add(m);
  if (collide) {
    addColliderBox(x - thickness/2, y0, (z1 + z2)/2 - d/2, x + thickness/2, y1, (z1 + z2)/2 + d/2);
  }
  return m;
}

function addWindow(x, y, z, side, width = 1.4, height = 1.6) {
  const frameThickness = 0.15;
  const depth = 0.12;
  let frame;
  let zOff;

  const matWindow = new THREE.MeshStandardMaterial({ color: 0x181410, roughness: 0.9 });

  if (side === 'front' || side === 'back') {
    zOff = side === 'front' ? 1 : -1;
    frame = new THREE.Group();
    const top = new THREE.Mesh(new THREE.BoxGeometry(width, frameThickness, depth), matWindow);
    top.position.set(x, y + height/2 + frameThickness/2, z + zOff * 0.05);
    frame.add(top);
    const bot = top.clone(); bot.position.y = y - height/2 - frameThickness/2;
    frame.add(bot);
    const leftF = new THREE.Mesh(new THREE.BoxGeometry(frameThickness, height, depth), matWindow);
    leftF.position.set(x - width/2 - frameThickness/2, y, z + zOff * 0.05);
    frame.add(leftF);
    const rightF = leftF.clone(); rightF.position.x = x + width/2 + frameThickness/2;
    frame.add(rightF);
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(width, height), matGlassBroken);
    glass.position.set(x, y, z + zOff * 0.02);
    if (side === 'front') glass.rotation.y = Math.PI;
    frame.add(glass);
    if (Math.random() < 0.5) {
      for (let i = 0; i < 2; i++) {
        const b = new THREE.Mesh(new THREE.BoxGeometry(width + 0.2, 0.18, 0.06), matBoard);
        b.position.set(x, y + (i === 0 ? -0.3 : 0.35), z + zOff * 0.15);
        b.rotation.z = (Math.random() - 0.5) * 0.25;
        frame.add(b);
      }
    }
  } else {
    zOff = side === 'left' ? -1 : 1;
    frame = new THREE.Group();
    const top = new THREE.Mesh(new THREE.BoxGeometry(depth, frameThickness, width), matWindow);
    top.position.set(x + zOff * 0.05, y + height/2 + frameThickness/2, z);
    frame.add(top);
    const bot = top.clone(); bot.position.y = y - height/2 - frameThickness/2;
    frame.add(bot);
    const leftF = new THREE.Mesh(new THREE.BoxGeometry(depth, height, frameThickness), matWindow);
    leftF.position.set(x + zOff * 0.05, y, z - width/2 - frameThickness/2);
    frame.add(leftF);
    const rightF = leftF.clone(); rightF.position.z = z + width/2 + frameThickness/2;
    frame.add(rightF);
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(width, height), matGlassBroken);
    glass.position.set(x + zOff * 0.02, y, z);
    glass.rotation.y = Math.PI / 2;
    frame.add(glass);
    if (Math.random() < 0.5) {
      for (let i = 0; i < 2; i++) {
        const b = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.18, width + 0.2), matBoard);
        b.position.set(x + zOff * 0.15, y + (i === 0 ? -0.3 : 0.35), z);
        b.rotation.x = (Math.random() - 0.5) * 0.25;
        frame.add(b);
      }
    }
  }
  houseGroup.add(frame);
}

/* ============================================================
   ===================== WALL LAMPS (БРА) =====================
   ============================================================
   ИСПРАВЛЕНО: интенсивности увеличены в ~30-40 раз (физические
   канделы в r155+), дистанция 14-18 м, decay 1.7 — теперь свет
   реально ложится на стены, землю и траву вокруг дома.
   ============================================================ */
const flickerLights = [];

function createWallLamp(x, y, z, facing, opts = {}) {
  const lit = opts.lit !== false;
  const group = new THREE.Group();

  const bracketMat = new THREE.MeshStandardMaterial({
    color: 0x241610, roughness: 0.85, metalness: 0.55
  });
  const shadeMat = new THREE.MeshStandardMaterial({
    color: 0x2a1c10, roughness: 0.9,
    side: THREE.DoubleSide,
    emissive: lit ? 0xff9a55 : 0x000000,
    emissiveIntensity: lit ? 0.75 : 0
  });
  const bulbMat = new THREE.MeshBasicMaterial({
    color: lit ? 0xffd8a8 : 0x201410
  });

  const plate = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.24, 0.04), bracketMat);
  plate.position.set(0, 0.02, 0.02);
  group.add(plate);

  const arm1 = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.055, 0.18), bracketMat);
  arm1.position.set(0, 0.10, 0.11);
  group.add(arm1);

  const arm2 = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.10, 0.055), bracketMat);
  arm2.position.set(0, 0.05, 0.19);
  group.add(arm2);

  const swirl = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.012, 6, 12, Math.PI * 1.2), bracketMat);
  swirl.position.set(0, 0.14, 0.14);
  swirl.rotation.z = -0.4;
  group.add(swirl);

  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.20, 12, 1, true), shadeMat);
  shade.position.set(0, -0.10, 0.19);
  group.add(shade);

  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.008, 6, 16), bracketMat);
  rim.rotation.x = Math.PI / 2;
  rim.position.set(0, -0.20, 0.19);
  group.add(rim);

  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 8), bulbMat);
  bulb.position.set(0, -0.12, 0.19);
  group.add(bulb);

  if (lit) {
    // ИСПРАВЛЕНО: интенсивность ~30-40x больше, дистанция 14-18м, decay 1.7
    const light = new THREE.PointLight(
      opts.color || 0xffb070,
      opts.intensity || 40,
      opts.distance || 16,
      1.7
    );
    light.position.set(0, -0.16, 0.22);
    group.add(light);

    if (opts.flicker) {
      flickerLights.push({
        light,
        baseIntensity: opts.intensity || 40,
        phase: Math.random() * 100,
        speed: 6 + Math.random() * 8,
        depth: 0.35 + Math.random() * 0.4
      });
    }
  }

  group.position.set(x, y, z);
  if (facing === 'front') {
    group.rotation.y = 0;
  } else if (facing === 'back') {
    group.rotation.y = Math.PI;
  } else if (facing === 'left') {
    group.rotation.y = -Math.PI / 2;
  } else if (facing === 'right') {
    group.rotation.y = Math.PI / 2;
  }

  houseGroup.add(group);
  return group;
}

/* ============================================================
   ==================== FLOOR HEIGHT SYSTEM ===================
   ============================================================ */
const HOUSE_BOUNDS = {
  x0: HX0, x1: HX1, z0: HZ0, z1: HZ1
};
const STAIRS_BOUNDS = {
  x0: -2, x1: 2, z0: -29, z1: -25
};

function insideHouse(x, z) {
  return x > HOUSE_BOUNDS.x0 && x < HOUSE_BOUNDS.x1 &&
         z > HOUSE_BOUNDS.z0 && z < HOUSE_BOUNDS.z1;
}

function computeFloorY(x, z, feetY) {
  if (!insideHouse(x, z)) {
    if (x > -3 && x < 3 && z > HZ1 && z < HZ1 + 3) {
      return FLOOR_Y;
    }
    return flattenAroundHouse(x, z);
  }

  if (x > STAIRS_BOUNDS.x0 && x < STAIRS_BOUNDS.x1 &&
      z > STAIRS_BOUNDS.z0 && z < STAIRS_BOUNDS.z1) {
    const t = (z - STAIRS_BOUNDS.z0) / (STAIRS_BOUNDS.z1 - STAIRS_BOUNDS.z0);
    return FLOOR_Y + t * (CEIL1_Y - FLOOR_Y + 0.1);
  }

  if (feetY > (CEIL1_Y + FLOOR_Y) * 0.5) return CEIL1_Y + 0.05;
  return FLOOR_Y;
}

function playerCollides(x, y, z) {
  const r = 0.28;
  const feetY = y - player.eyeHeight;
  const headY = y + 0.15;
  for (let i = 0; i < colliders.length; i++) {
    const c = colliders[i];
    if (x + r > c.min.x && x - r < c.max.x &&
        z + r > c.min.z && z - r < c.max.z &&
        headY > c.min.y && feetY < c.max.y) {
      return true;
    }
  }
  return false;
}

const joystickEl = document.getElementById('joystick');
const knobEl = document.getElementById('knob');
const lookzoneEl = document.getElementById('lookzone');
const joystickState = { x: 0, y: 0, active: false, touchId: null };

function showTouchControls() {
  if (!isTouchDevice) return;
  joystickEl.style.display = 'block';
  lookzoneEl.style.display = 'block';
  document.getElementById('hint').textContent = 'Слева — ходьба · Справа — камера · 🔦 фонарик';
}
showTouchControls();

const joyRectCache = { x: 0, y: 0, size: 0, cx: 0, cy: 0 };
function updateJoyRect() {
  const r = joystickEl.getBoundingClientRect();
  joyRectCache.x = r.left; joyRectCache.y = r.top;
  joyRectCache.size = r.width;
  joyRectCache.cx = r.left + r.width / 2;
  joyRectCache.cy = r.top + r.height / 2;
}

joystickEl.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (menuOpen) return;
  updateJoyRect();
  const t = e.changedTouches[0];
  joystickState.active = true;
  joystickState.touchId = t.identifier;
  handleJoyMove(t.clientX, t.clientY);
}, { passive: false });
joystickEl.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (menuOpen) return;
  for (const t of e.changedTouches) {
    if (t.identifier === joystickState.touchId) handleJoyMove(t.clientX, t.clientY);
  }
}, { passive: false });
function endJoy(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === joystickState.touchId) {
      joystickState.active = false;
      joystickState.touchId = null;
      joystickState.x = 0; joystickState.y = 0;
      knobEl.style.transform = 'translate(-50%, -50%)';
    }
  }
}
joystickEl.addEventListener('touchend', endJoy);
joystickEl.addEventListener('touchcancel', endJoy);

function handleJoyMove(cx, cy) {
  const dx = cx - joyRectCache.cx;
  const dy = cy - joyRectCache.cy;
  const maxR = joyRectCache.size / 2 - 12;
  const d = Math.hypot(dx, dy);
  let nx = dx, ny = dy;
  if (d > maxR) { nx = dx / d * maxR; ny = dy / d * maxR; }
  knobEl.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
  joystickState.x = nx / maxR;
  joystickState.y = ny / maxR;
}

const lookState = { touchId: null, lastX: 0, lastY: 0 };
lookzoneEl.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (menuOpen) return;
  if (lookState.touchId !== null) return;
  const t = e.changedTouches[0];
  lookState.touchId = t.identifier;
  lookState.lastX = t.clientX;
  lookState.lastY = t.clientY;
}, { passive: false });
lookzoneEl.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (menuOpen) return;
  for (const t of e.changedTouches) {
    if (t.identifier === lookState.touchId) {
      const dx = t.clientX - lookState.lastX;
      const dy = t.clientY - lookState.lastY;
      player.yaw -= dx * 0.006;
      player.pitch -= dy * 0.006;
      const lim = Math.PI / 2 - 0.02;
      if (player.pitch > lim) player.pitch = lim;
      if (player.pitch < -lim) player.pitch = -lim;
      lookState.lastX = t.clientX;
      lookState.lastY = t.clientY;
    }
  }
}, { passive: false });
function endLook(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === lookState.touchId) lookState.touchId = null;
  }
}
lookzoneEl.addEventListener('touchend', endLook);
lookzoneEl.addEventListener('touchcancel', endLook);

/* ---- MOVEMENT ---- */
const GRAVITY = -20;
const WALK_SPEED = 2.6;
const RUN_SPEED = 5.2;
const JUMP_VELOCITY = 5.5;

function updatePlayer(dt) {
  let inX = 0, inZ = 0;
  if (!menuOpen) {
    if (keys['KeyW'] || keys['ArrowUp']) inZ -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) inZ += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) inX -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) inX += 1;
    if (joystickState.active) {
      inX += joystickState.x;
      inZ += joystickState.y;
    }
  }

  const mag = Math.hypot(inX, inZ);
  if (mag > 1) { inX /= mag; inZ /= mag; }

  const running = !menuOpen && (keys['ShiftLeft'] || keys['ShiftRight']);
  const speed = running ? RUN_SPEED : WALK_SPEED;

  const cosY = Math.cos(player.yaw);
  const sinY = Math.sin(player.yaw);
  const fwdX = -sinY, fwdZ = -cosY;
  const rgtX = cosY, rgtZ = -sinY;

  const mx = (fwdX * (-inZ) + rgtX * inX) * speed;
  const mz = (fwdZ * (-inZ) + rgtZ * inX) * speed;

  const accel = player.onGround ? 14 : 4;
  player.vel.x += (mx - player.vel.x) * Math.min(1, accel * dt);
  player.vel.z += (mz - player.vel.z) * Math.min(1, accel * dt);

  player.vel.y += GRAVITY * dt;

  if (!menuOpen && keys['Space'] && player.onGround) {
    player.vel.y = JUMP_VELOCITY;
    player.onGround = false;
  }

  const nx = player.pos.x + player.vel.x * dt;
  if (!playerCollides(nx, player.pos.y, player.pos.z)) {
    player.pos.x = nx;
  } else {
    player.vel.x = 0;
  }
  const nz = player.pos.z + player.vel.z * dt;
  if (!playerCollides(player.pos.x, player.pos.y, nz)) {
    player.pos.z = nz;
  } else {
    player.vel.z = 0;
  }
  player.pos.y += player.vel.y * dt;

  const floorY = computeFloorY(player.pos.x, player.pos.z, player.pos.y - player.eyeHeight);
  const targetEyeY = floorY + player.eyeHeight;
  if (player.pos.y <= targetEyeY) {
    player.pos.y = targetEyeY;
    if (player.vel.y < 0) player.vel.y = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  const WORLD_LIMIT = 130;
  if (Math.abs(player.pos.x) > WORLD_LIMIT) player.pos.x = Math.sign(player.pos.x) * WORLD_LIMIT;
  if (Math.abs(player.pos.z) > WORLD_LIMIT) player.pos.z = Math.sign(player.pos.z) * WORLD_LIMIT;

  const hspeed = Math.hypot(player.vel.x, player.vel.z);
  if (player.onGround && hspeed > 0.4) {
    player.bobPhase += dt * (running ? 11 : 8);
  } else {
    player.bobPhase += dt * 1.2;
  }
  const bobAmt = Math.min(hspeed / RUN_SPEED, 1) * 0.022;
  const bobY = Math.sin(player.bobPhase) * bobAmt;
  const bobX = Math.cos(player.bobPhase * 0.5) * bobAmt * 0.6;

  camera.position.x += (player.pos.x + bobX * Math.cos(player.yaw) - camera.position.x) * Math.min(1, dt * 18);
  camera.position.y += (player.pos.y + bobY - camera.position.y) * Math.min(1, dt * 14);
  camera.position.z += (player.pos.z - bobX * Math.sin(player.yaw) - camera.position.z) * Math.min(1, dt * 18);

  const q = new THREE.Quaternion();
  q.setFromEuler(new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ'));
  camera.quaternion.copy(q);
}

/* ============================================================
   ==================== RESIZE / QUALITY ======================
   ============================================================ */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  const dpr = Math.min(window.devicePixelRatio || 1, preset.pixel);
  renderer.setPixelRatio(dpr);
  starMat.uniforms.uPixelRatio.value = dpr;
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

const qualitySelect = document.getElementById('quality-select');
qualitySelect.value = currentQuality;

function applyQuality(q) {
  currentQuality = q;
  preset = QUALITY_PRESETS[q];
  grassUniforms.uRenderDist.value = preset.grassDist;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, preset.pixel));
  starMat.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio || 1, preset.pixel);
  buildGrass();
}
qualitySelect.addEventListener('change', () => {
  userOverrodeQuality = true;
  applyQuality(qualitySelect.value);
});

let targetFPS = 60;
let targetFrameInterval = 1000 / 60;
const fpsValueEl = document.getElementById('fps-value');
const fpsTargetEl = document.getElementById('fps-target');
const fpsButtons = document.querySelectorAll('#fps-buttons button');

function setTargetFPS(fps, fromUser) {
  targetFPS = fps;
  targetFrameInterval = 1000 / fps;
  fpsButtons.forEach(b => b.classList.toggle('active', parseInt(b.dataset.fps, 10) === fps));
  if (fpsTargetEl) fpsTargetEl.textContent = String(fps);
}
fpsButtons.forEach(b => {
  b.addEventListener('click', () => setTargetFPS(parseInt(b.dataset.fps, 10), true));
});
setTargetFPS(60, false);

/* ============================================================
   ====================== MAIN LOOP ===========================
   ============================================================ */
let lastFrameTime = performance.now();
let firstFrameRendered = false;
let fpsFrameCount = 0;
let fpsWindowStart = performance.now();

const clockT = { t: 0 };

function animate(now) {
  requestAnimationFrame(animate);

  const elapsed = now - lastFrameTime;
  if (firstFrameRendered && elapsed < targetFrameInterval - 1.0) return;

  if (firstFrameRendered) {
    lastFrameTime = now - (elapsed % targetFrameInterval);
  } else {
    lastFrameTime = now;
    firstFrameRendered = true;
  }

  const dt = Math.min(elapsed / 1000, 0.05);
  clockT.t += dt;

  updatePlayer(dt);

  grassUniforms.uTime.value = clockT.t;
  grassUniforms.uCameraPos.value.copy(camera.position);
  starMat.uniforms.uTime.value = clockT.t;
  skyMat.uniforms.uMoonDir.value.copy(MOON_DIR);

  const gust = 0.85 + 0.4 * Math.sin(clockT.t * 0.22) + 0.15 * Math.sin(clockT.t * 0.7 + 1.4);
  grassUniforms.uWindStrength.value = Math.max(0.4, gust);

  skyMesh.position.copy(camera.position);
  starPoints.position.copy(camera.position);
  moonGroup.position.copy(camera.position).add(MOON_DIR.clone().multiplyScalar(400));

  moonLight.position.copy(camera.position).add(MOON_DIR.clone().multiplyScalar(60));
  moonLight.target.position.copy(camera.position);
  moonLight.target.updateMatrixWorld();

  if (window.__childLight) {
    const f = 0.6 + 0.4 * Math.sin(clockT.t * 22 + Math.sin(clockT.t * 3.7) * 4)
                   + 0.2 * Math.sin(clockT.t * 41);
    window.__childLight.intensity = Math.max(0.15, f) * 20;
  }

  /* ---- Wall lamp flicker ---- */
  for (let i = 0; i < flickerLights.length; i++) {
    const fl = flickerLights[i];
    const t = clockT.t * fl.speed + fl.phase;
    const pulse = 0.55
                + 0.45 * Math.sin(t)
                + 0.15 * Math.sin(t * 3.1 + 1.7)
                + 0.08 * Math.sin(t * 7.3 + 0.4);
    const v = Math.max(0.05, Math.min(1.25, pulse));
    fl.light.intensity = fl.baseIntensity * (1 - fl.depth + fl.depth * v);
  }

  renderer.render(scene, camera);

  fpsFrameCount++;
  const nowMs = performance.now();
  if (nowMs - fpsWindowStart >= 500) {
    const realFps = fpsFrameCount * 1000 / (nowMs - fpsWindowStart);
    if (fpsValueEl) fpsValueEl.textContent = realFps.toFixed(0);
    fpsFrameCount = 0;
    fpsWindowStart = nowMs;
  }
}

onResize();

requestAnimationFrame((t) => {
  lastFrameTime = t;
  firstFrameRendered = false;
  requestAnimationFrame(animate);
  requestAnimationFrame(() => {
    loadingEl.classList.add('hidden');
    setTimeout(() => { loadingEl.style.display = 'none'; }, 500);
  });
});

setTimeout(() => {
  if (!pointerLocked && !isTouchDevice) return;
  document.getElementById('hint').classList.add('hidden');
}, 9000);

document.addEventListener('pointerlockerror', () => {
  console.warn('Pointer lock error');
});

</script>
