<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Echo of the Room - Horror</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            user-select: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
        }
        h1 {
            color: #b00;
            text-shadow: 0 0 10px rgba(255,0,0,0.5);
            font-size: 28px;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .btn {
            background: #222;
            color: #fff;
            border: 2px solid #500;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,0,0,0.2);
            border-radius: 8px;
        }
        #action-btn {
            pointer-events: auto;
            background: rgba(40, 40, 40, 0.8);
            color: white;
            border: 2px solid #888;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            display: none;
            margin-bottom: 40px;
        }
        #instructions {
            color: #777;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            max-width: 300px;
        }
        #story-text {
            color: #fff;
            font-size: 16px;
            text-align: center;
            text-shadow: 0 0 5px #000;
            margin-top: 20px;
        }
    </style>
    <!-- Подключаем Three.js для 3D-графики -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1>THE ECHO OF THE ROOM</h1>
        <button class="btn" onclick="startGame()">НАЧАТЬ</button>
        <div id="instructions">Левая половина экрана — движение.<br>Правая половина — осмотр комнаты.<br>Взаимодействуйте с объектами кнопкой действия.</div>
    </div>

    <div id="ui-layer">
        <div id="story-text">Осмотрите комнату...</div>
        <button id="action-btn" onclick="triggerAction()">ДЕЙСТВИЕ</button>
    </div>

    <script>
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTouchX = 0, prevTouchY = 0;
        let pitch = 0, yaw = 0;
        let roomLight, tvScreen;
        let audioCtx;
        
        let gameState = 0; 
        // 0: Старт, 1: Ожидание/Мигание, 2: Телевизор, 3: Тревога/Выключение, 4: Шкаф, 5: Поиск щитка, 6: Победа

        let interactableObjects = [];
        let currentTargetObject = null;
        let isHiding = false;
        let playerPos = { x: 0, z: 0 };

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            initAudio();
            init3D();
            setupControls();
            startStorySequence();
        }

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;

            if (type === 'switch') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.05);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'static') {
                // Белый шум для телевизора
                let bufferSize = audioCtx.sampleRate * 2;
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                let whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = buffer;
                whiteNoise.loop = true;
                whiteNoise.connect(gain);
                gain.gain.setValueAtTime(0.1, now);
                whiteNoise.start(now);
                setTimeout(() => whiteNoise.stop(), 3000);
            } else if (type === 'scary') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.linearRampToValueAtTime(300, now + 4);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.4, now + 4);
                osc.start(now);
                osc.stop(now + 4);
            }
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020202);
            scene.fog = new THREE.FogExp2(0x020202, 0.1);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 2);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Освещение
            const ambientLight = new THREE.AmbientLight(0x101015);
            scene.add(ambientLight);

            roomLight = new THREE.PointLight(0xffeedd, 1.2, 15);
            roomLight.position.set(0, 3.5, 0);
            scene.add(roomLight);

            // Комната (по плану из эскиза)
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x333338, roughness: 0.9 });
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1c, roughness: 0.8 });

            // Пол
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Задняя стена
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 5), wallMat);
            backWall.position.set(0, 2.5, -4);
            scene.add(backWall);

            // Левая стена
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 5), wallMat);
            leftWall.position.set(-4, 2.5, 0);
            leftWall.rotation.y = Math.PI / 2;
            scene.add(leftWall);

            // --- ОБЪЕКТЫ ПО ЕВАШЕМУ ЧЕРТЕЖУ ---

            // 1. Телевизор и тумба (на задней стене, справа)
            const tvStand = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0x221100 }));
            tvStand.position.set(1.5, 0.4, -3.5);
            scene.add(tvStand);

            const tvGeom = new THREE.BoxGeometry(1.2, 0.7, 0.1);
            const tvMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
            tvScreen = new THREE.Mesh(tvGeom, tvMat);
            tvScreen.position.set(1.5, 1.1, -3.55);
            scene.add(tvScreen);
            registerInteractable(tvScreen, "Телевизор", () => {});

            // 2. Шкаф (на задней стене, слева)
            const closetGeo = new THREE.BoxGeometry(1.6, 2.5, 0.8);
            const closetMat = new THREE.MeshStandardMaterial({ color: 0x3a2518 });
            const closet = new THREE.Mesh(closetGeo, closetMat);
            closet.position.set(-1.5, 1.25, -3.6);
            scene.add(closet);
            registerInteractable(closet, "Шкаф (Спрятаться)", () => {
                if (gameState === 4) {
                    isHiding = !isHiding;
                    camera.position.set(isHiding ? -1.5 : 0, 1.6, isHiding ? -3.2 : 2);
                    document.getElementById('story-text.innerText') = isHiding ? "Вы в шкафу. Тихо..." : "Вы вышли из шкафа.";
                    if (isHiding) {
                        setTimeout(() => {
                            gameState = 5;
                            document.getElementById('story-text.innerText'] = "Найдите электрический счетчик на стене!";
                        }, 5000);
                    }
                }
            });

            // 3. Выключатель света (на левой стене)
            const sw = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.2), new THREE.MeshBasicMaterial({ color: 0xcccccc }));
            sw.position.set(-3.95, 1.4, -1);
            scene.add(sw);
            registerInteractable(sw, "Выключатель света", () => {
                if (gameState < 3) {
                    roomLight.visible = !roomLight.visible;
                    playSound('switch');
                }
            });

            // 4. Электрический счетчик (на левой стене ближе к выходу)
            const fuseBox = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0x555555 }));
            fuseBox.position.set(-3.95, 1.5, 1.5);
            scene.add(fuseBox);
            registerInteractable(fuseBox, "Электрический счетчик", () => {
                if (gameState === 5) {
                    roomLight.visible = true;
                    roomLight.intensity = 1.5;
                    playSound('switch');
                    gameState = 6;
                    document.getElementById('story-text').innerText = "Свет включен! Вы победили.";
                    document.getElementById('action-btn').style.display = 'none';
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        function registerInteractable(mesh, name, action) {
            interactableObjects.push({ mesh, name, action });
        }

        function setupControls() {
            let isDragging = false;

            window.addEventListener('touchstart', (e) => {
                if (e.touches[0].clientX > window.innerWidth / 2) {
                    isDragging = true;
                    prevTouchX = e.touches[0].clientX;
                    prevTouchY = e.touches[0].clientY;
                } else {
                    // Левая часть - движение
                    moveForward = true;
                }
            });

            window.addEventListener('touchmove', (e) => {
                if (isDragging) {
                    let deltaX = e.touches[0].clientX - prevTouchX;
                    let deltaY = e.touches[0].clientY - prevTouchY;
                    yaw -= deltaX * 0.005;
                    pitch -= deltaY * 0.005;
                    pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
                    prevTouchX = e.touches[0].clientX;
                    prevTouchY = e.touches[0].clientY;
                }
            });

            window.addEventListener('touchend', () => {
                isDragging = false;
                moveForward = false;
            });
        }

        function startStorySequence() {
            setTimeout(() => {
                // Мигание света
                gameState = 1;
                document.getElementById('story-text').innerText = "...";
                let flickers = 0;
                let interval = setInterval(() => {
                    roomLight.visible = !roomLight.visible;
                    playSound('switch');
                    flickers++;
                    if (flickers > 6) {
                        roomLight.visible = true;
                        clearInterval(interval);
                        
                        // Ощущение за спиной
                        setTimeout(() => {
                            document.getElementById('story-text').innerText = "Вам показалось, что кто-то позади...";
                            
                            // Телевизор включается
                            setTimeout(() => {
                                gameState = 2;
                                tvScreen.material.color.setHex(0x336699);
                                playSound('static');
                                document.getElementById('story-text').innerText = "Телевизор включился сам...";
                                
                                // Тревога и выключение света
                                setTimeout(() => {
                                    gameState = 3;
                                    playSound('scary');
                                    roomLight.visible = false;
                                    document.getElementById('story-text').innerText = "Свет погас! Срочно спрячьтесь в шкаф!";
                                    gameState = 4; // Разрешаем прятаться
                                }, 5000);
                            }, 4000);
                        }, 3000);
                    }
                }, 400);
            }, 5000);
        }

        function checkRaycast() {
            if (isHiding && gameState === 4) return;
            
            let raycaster = new THREE.Raycaster();
            let dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            raycaster.set(camera.position, dir);

            let meshes = interactableObjects.map(o => o.mesh);
            let intersects = raycaster.intersectObjects(meshes);

            let actionBtn = document.getElementById('action-btn');
            if (intersects.length > 0 && intersects[0].distance < 3.5) {
                let obj = interactableObjects.find(o => o.mesh === intersects[0].object);
                if (obj) {
                    currentTargetObject = obj;
                    actionBtn.style.display = 'block';
                    actionBtn.innerText = obj.name;
                    return;
                }
            }
            currentTargetObject = null;
            if(gameState !== 6) actionBtn.style.display = 'none';
        }

        function triggerAction() {
            if (currentTargetObject) {
                currentTargetObject.action();
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Движение вперед при зажатой левой половине
            if (moveForward && !isHiding) {
                let dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0;
                dir.normalize();
                camera.position.addScaledVector(dir, 0.03);
                // Ограничения комнаты
                camera.position.x = Math.max(-3.5, Math.min(3.5, camera.position.x));
                camera.position.z = Math.max(-3.5, Math.min(3.5, camera.position.z));
            }

            // Вращение камеры
            let euler = new THREE.Euler(0, 0, 0, 'YXZ');
            euler.x = pitch;
            euler.y = yaw;
            camera.quaternion.setFromEuler(euler);

            checkRaycast();

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
