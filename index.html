<!doctype html>
<html lang="ru" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- =========================== -->
    <!-- Общие meta и PWA настройки -->
    <!-- =========================== -->

    <!-- Цвет строки состояния / верхней панели браузера (Android, Chrome, Edge) -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Название PWA для iOS -->
    <meta name="apple-mobile-web-app-title" content="Мой ПВЗ" />

    <!-- Включает полноэкранный режим PWA на iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Стиль верхней статусной строки iOS: default | black | black-translucent -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Отключает перевод страницы Chromium-браузеров -->
    <meta name="google" content="notranslate" />

    <!-- =========================== -->
    <!-- Favicon для браузеров -->
    <!-- =========================== -->
    <!-- 16×16 — вкладки браузера -->
    <link rel="icon" href="/icons/16.png" sizes="16x16" />
    <!-- 32×32 — браузеры с высокой плотностью пикселей (Retina / 4K) -->
    <link rel="icon" href="/icons/32.png" sizes="32x32" />
    <!-- 48×48 — старые версии Windows / fallback -->
    <link rel="icon" href="/icons/48.png" sizes="48x48" />

    <!-- =========================== -->
    <!-- Apple iOS icons -->
    <!-- =========================== -->
    <!-- iPhone non-pro Retina -->
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/120.png" />
    <!-- iPad Retina -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/152.png" />
    <!-- iPad Pro -->
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/167.png" />
    <!-- iPhone Retina / современные iPhone -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/180.png" />
    <!-- fallback iOS -->
    <link rel="apple-touch-icon" href="/icons/512.png" />

    <!-- =========================== -->
    <!-- Windows Tiles (Pin to Start) -->
    <!-- =========================== -->
    <!-- Цвет плитки для Windows 8-10 -->
    <meta name="msapplication-TileColor" content="#ffffff" />
    <!-- Конфиг плиток для Windows 8-10 -->
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- =========================== -->
    <!-- Title -->
    <!-- =========================== -->
    <title>Мой ПВЗ</title>
    <script type="module" crossorigin src="/assets/index-BIfPBHhT.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/style-Fe3lSUDL.css">
  <link rel="manifest" href="/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
  </body>
</html>
