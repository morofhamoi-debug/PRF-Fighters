<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoMarket — Маркетплейс автомобилей</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #f1f5f9;
      color: #1e293b;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

    /* Шапка */
    .navbar { background: #0f172a; color: white; padding: 16px 0; }
    .navbar-content { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 24px; font-weight: bold; }
    .logo span { color: #38bdf8; }

    /* Блок поиска и фильтра */
    .filter-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin: 24px 0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .filter-card h2 { margin-top: 0; font-size: 18px; color: #0f172a; }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    /* Элементы форм */
    input, textarea, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 8px;
    }
    input:focus, textarea:focus { outline: 2px solid #0284c7; border-color: transparent; }
    
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-search { background: #10b981; color: white; }
    .btn-search:hover { background: #059669; }
    .btn-secondary { background: #94a3b8; color: white; }

    /* Сетка объявлений */
    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }
    .card-img { width: 100%; height: 190px; object-fit: cover; background: #e2e8f0; }
    .card-body { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 16px; margin: 0 0 6px 0; font-weight: 600; }
    .card-price { font-size: 20px; font-weight: 700; color: #059669; margin-bottom: 8px; }
    .card-meta { font-size: 13px; color: #64748b; margin-bottom: 4px; }
    .card-desc { font-size: 13px; color: #475569; margin-top: 8px; flex-grow: 1; }

    /* Модальное окно */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <!-- Шапка сайта -->
  <header class="navbar">
    <div class="container navbar-content">
      <div class="logo">Auto<span>Market</span></div>
      <button class="btn btn-primary" onclick="toggleModal(true)">+ Подать объявление</button>
    </div>
  </header>

  <!-- Основной контент -->
  <main class="container">
    <!-- Блок фильтрации -->
    <section class="filter-card">
      <h2>Поиск автомобилей</h2>
      <div class="filter-grid">
        <input type="text" id="searchBrand" placeholder="Марка (напр. BMW)">
        <input type="number" id="searchPrice" placeholder="Макс. цена (₽)">
        <input type="text" id="searchCity" placeholder="Город">
        <button class="btn btn-search" onclick="applyFilters()">Найти</button>
      </div>
    </section>

    <!-- Список машин -->
    <section class="listings-grid" id="carsContainer"></section>
  </main>

  <!-- Модальное окно создания объявления -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3 style="margin-top:0;">Новое объявление</h3>
      <form id="createForm" onsubmit="handleCreate(event)">
        <input type="text" id="formTitle" placeholder="Заголовок (напр. BMW 5 Series)" required>
        <input type="text" id="formBrand" placeholder="Марка (напр. BMW)" required>
        <input type="text" id="formModel" placeholder="Модель (напр. 520i)" required>
        <input type="number" id="formYear" placeholder="Год выпуска" required>
        <input type="number" id="formPrice" placeholder="Цена (₽)" required>
        <input type="number" id="formMileage" placeholder="Пробег (км)" required>
        <input type="text" id="formCity" placeholder="Город" required>
        <input type="url" id="formImage" placeholder="Ссылка на фото (URL)">
        <textarea id="formDesc" placeholder="Описание автомобиля..." rows="3"></textarea>
        <div style="display:flex; gap:10px; margin-top:10px;">
          <button type="submit" class="btn btn-primary" style="flex:1">Опубликовать</button>
          <button type="button" class="btn btn-secondary" onclick="toggleModal(false)">Отмена</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // База данных в памяти браузера (с возможностью сохранения новых авто)
    let initialCars = [
      {
        id: 1,
        title: 'BMW 5 Series 520i',
        brand: 'BMW',
        model: '5 Series',
        year: 2021,
        price: 4350000,
        mileage: 42000,
        city: 'Москва',
        description: 'Состояние нового авто, один хозяин, на гарантии.',
        image_url: 'https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 2,
        title: 'Toyota RAV4 2.5 AT',
        brand: 'Toyota',
        model: 'RAV4',
        year: 2019,
        price: 2950000,
        mileage: 68000,
        city: 'Санкт-Петербург',
        description: 'Полный привод, максимальная комплектация.',
        image_url: 'https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 3,
        title: 'Mercedes-Benz E-Класс 200',
        brand: 'Mercedes-Benz',
        model: 'E-Class',
        year: 2020,
        price: 4800000,
        mileage: 35000,
        city: 'Казань',
        description: 'Без ДТП, обслуживание только у официального дилера.',
        image_url: 'https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?auto=format&fit=crop&w=600&q=80'
      }
    ];

    // Загрузка сохраненных данных из localStorage или загрузка начальных
    let cars = JSON.parse(localStorage.getItem('automarket_cars')) || initialCars;

    function renderCars(data) {
      const container = document.getElementById('carsContainer');
      if (!data.length) {
        container.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#64748b;">Объявления не найдены</p>';
        return;
      }

      container.innerHTML = data.map(car => `
        <div class="card">
          <img src="${car.image_url}" class="card-img" alt="${car.title}" onerror="this.src='https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=600&q=80'">
          <div class="card-body">
            <h3 class="card-title">${car.title}</h3>
            <div class="card-price">${Number(car.price).toLocaleString()} ₽</div>
            <div class="card-meta">${car.brand} ${car.model} • ${car.year} г. • ${Number(car.mileage).toLocaleString()} км</div>
            <div class="card-meta">📍 ${car.city}</div>
            <p class="card-desc">${car.description || 'Без описания.'}</p>
          </div>
        </div>
      `).join('');
    }

    function applyFilters() {
      const brand = document.getElementById('searchBrand').value.toLowerCase().trim();
      const maxPrice = Number(document.getElementById('searchPrice').value);
      const city = document.getElementById('searchCity').value.toLowerCase().trim();

      const filtered = cars.filter(car => {
        const matchBrand = !brand || car.brand.toLowerCase().includes(brand);
        const matchPrice = !maxPrice || car.price <= maxPrice;
        const matchCity = !city || car.city.toLowerCase().includes(city);
        return matchBrand && matchPrice && matchCity;
      });

      renderCars(filtered);
    }

    function handleCreate(e) {
      e.preventDefault();
      
      const newCar = {
        id: Date.now(),
        title: document.getElementById('formTitle').value,
        brand: document.getElementById('formBrand').value,
        model: document.getElementById('formModel').value,
        year: Number(document.getElementById('formYear').value),
        price: Number(document.getElementById('formPrice').value),
        mileage: Number(document.getElementById('formMileage').value),
        city: document.getElementById('formCity').value,
        image_url: document.getElementById('formImage').value || 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=600&q=80',
        description: document.getElementById('formDesc').value,
      };

      cars.unshift(newCar);
      localStorage.setItem('automarket_cars', JSON.stringify(cars));
      
      toggleModal(false);
      document.getElementById('createForm').reset();
      renderCars(cars);
    }

    function toggleModal(show) {
      const modal = document.getElementById('addModal');
      if (show) modal.classList.add('active');
      else modal.classList.remove('active');
    }

    // Инициализация отображения при старте
    renderCars(cars);
  </script>
</body>
</html>
