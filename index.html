<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vexa Messenger</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 50%, #d8b4fe 100%);
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(126, 34, 206, 0.15);
        }

        @media (min-width: 481px) {
            .app-container {
                height: 85vh;
                border-radius: 24px;
            }
        }

        /* Экран авторизации (в начале) */
        .auth-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffffff 0%, #f3e8ff 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            z-index: 100;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .auth-screen.hidden {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .auth-logo {
            font-size: 36px;
            font-weight: 800;
            color: #7c3aed;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .auth-subtitle {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 30px;
            text-align: center;
        }

        .auth-input {
            width: 100%;
            max-width: 320px;
            padding: 14px 18px;
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 14px;
            font-size: 16px;
            color: #1f2937;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .auth-input:focus {
            border-color: #7c3aed;
        }

        .auth-btn {
            width: 100%;
            max-width: 320px;
            padding: 14px;
            background: #7c3aed;
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
            transition: background 0.2s;
        }

        .auth-btn:active {
            background: #6d28d9;
        }

        /* Шапка */
        .header {
            padding: 15px 20px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f3f4f6;
            height: 60px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #7c3aed;
            letter-spacing: 0.5px;
        }

        /* Экраны мессенджера */
        .screen {
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            transition: transform 0.3s ease;
        }

        .screen.hidden-left {
            transform: translateX(-100%);
        }

        .screen.hidden-right {
            transform: translateX(100%);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
        }

        /* Контейнер чата с поддержкой свайпа/удержания */
        .chat-item-wrapper {
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid #f3f4f6;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            gap: 15px;
            background: #ffffff;
            position: relative;
            z-index: 2;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #f3e8ff;
            color: #7c3aed;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }

        .chat-info {
            flex: 1;
            overflow: hidden;
        }

        .chat-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #1f2937;
        }

        .chat-last-message {
            font-size: 14px;
            color: #6b7280;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Скрытые действия при свайпе */
        .chat-actions {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            display: flex;
            z-index: 1;
        }

        .action-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 13px;
            font-weight: 600;
            width: 80px;
            cursor: pointer;
            border: none;
        }

        .action-archive {
            background: #3b82f6;
        }

        .action-delete {
            background: #ef4444;
        }

        /* Окно переписки */
        .back-btn {
            background: none;
            border: none;
            color: #7c3aed;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
        }

        .chat-title-container {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
        }

        .chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #faf5ff;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.4;
        }

        .message.incoming {
            background: #ffffff;
            color: #1f2937;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .message.outgoing {
            background: #7c3aed;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-footer {
            padding: 12px 15px;
            background: #ffffff;
            display: flex;
            gap: 10px;
            border-top: 1px solid #f3f4f6;
        }

        .chat-input {
            flex: 1;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 10px 16px;
            color: #1f2937;
            font-size: 15px;
            outline: none;
        }

        .chat-input:focus {
            border-color: #7c3aed;
        }

        .send-btn {
            background: #7c3aed;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #fff;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ЭКРАН АВТОРИЗАЦИИ В НАЧАЛЕ -->
        <div class="auth-screen" id="authScreen">
            <div class="auth-logo">Vexa</div>
            <div class="auth-subtitle">Войдите по номеру телефона</div>
            
            <input type="tel" id="phoneInput" class="auth-input" placeholder="+7 (999) 000-00-00">
            <input type="text" id="codeInput" class="auth-input" placeholder="Код подтверждения" style="display: none;">
            
            <button class="auth-btn" id="authBtn" onclick="handleAuth()">Получить код</button>
        </div>

        <!-- ЭКРАН 1: Список чатов -->
        <div class="screen" id="chatsScreen">
            <div class="header">
                <div class="logo">Vexa</div>
            </div>
            <div class="chats-list" id="chatsListContainer">
                
                <div class="chat-item-wrapper" id="chat-1">
                    <div class="chat-item" onclick="openChat('Техподдержка Vexa', 'Привет! Чем можем помочь?')" oncontextmenu="showActions(event, 'chat-1')">
                        <div class="chat-avatar">TV</div>
                        <div class="chat-info">
                            <div class="chat-name">Техподдержка Vexa</div>
                            <div class="chat-last-message">Привет! Чем можем помочь?</div>
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button class="action-btn action-archive" onclick="archiveChat('chat-1')">Архив</button>
                        <button class="action-btn action-delete" onclick="deleteChat('chat-1')">Удалить</button>
                    </div>
                </div>

                <div class="chat-item-wrapper" id="chat-2">
                    <div class="chat-item" onclick="openChat('Иван', 'Скинь код проекта, когда будет время')" oncontextmenu="showActions(event, 'chat-2')">
                        <div class="chat-avatar" style="background: #e0e7ff; color: #3b82f6;">И</div>
                        <div class="chat-info">
                            <div class="chat-name">Иван</div>
                            <div class="chat-last-message">Скинь код проекта, когда будет время</div>
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button class="action-btn action-archive" onclick="archiveChat('chat-2')">Архив</button>
                        <button class="action-btn action-delete" onclick="deleteChat('chat-2')">Удалить</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- ЭКРАН 2: Окно переписки -->
        <div class="screen hidden-right" id="chatScreen">
            <div class="header">
                <button class="back-btn" onclick="closeChat()">‹ Назад</button>
                <div class="chat-title-container" id="activeChatTitle">Чат</div>
                <div style="width: 50px;"></div>
            </div>

            <div class="chat-body" id="chatBody"></div>

            <div class="chat-footer">
                <input type="text" id="messageInput" class="chat-input" placeholder="Сообщение..." onkeypress="checkEnter(event)">
                <button class="send-btn" onclick="sendMessage()">➔</button>
            </div>
        </div>

    </div>

    <script>
        let authStep = 1;

        function handleAuth() {
            const phoneInput = document.getElementById('phoneInput');
            const codeInput = document.getElementById('codeInput');
            const authBtn = document.getElementById('authBtn');

            if (authStep === 1) {
                if (phoneInput.value.trim() === '') return;
                phoneInput.style.display = 'none';
                codeInput.style.display = 'block';
                codeInput.placeholder = 'Код (тест: 1234)';
                authBtn.textContent = 'Подтвердить';
                authStep = 2;
            } else {
                if (codeInput.value.trim() === '') return;
                document.getElementById('authScreen').classList.add('hidden');
            }
        }

        let currentChatName = '';

        function openChat(name, lastMessage) {
            currentChatName = name;
            document.getElementById('activeChatTitle').textContent = name;
            
            const chatBody = document.getElementById('chatBody');
            chatBody.innerHTML = `<div class="message incoming">${lastMessage}</div>`;

            document.getElementById('chatsScreen').classList.add('hidden-left');
            document.getElementById('chatScreen').classList.remove('hidden-right');
        }

        function closeChat() {
            document.getElementById('chatsScreen').classList.remove('hidden-left');
            document.getElementById('chatScreen').classList.add('hidden-right');
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const chatBody = document.getElementById('chatBody');
            
            if (input.value.trim() === '') return;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message outgoing';
            msgDiv.textContent = input.value;
            chatBody.appendChild(msgDiv);

            input.value = '';
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function checkEnter(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        // Логика свайпа и удержания для удаления/архивации
        function deleteChat(chatId) {
            const elem = document.getElementById(chatId);
            elem.style.transition = 'all 0.3s ease';
            elem.style.transform = 'translateX(-100%)';
            elem.style.opacity = '0';
            setTimeout(() => elem.remove(), 300);
        }

        function archiveChat(chatId) {
            const elem = document.getElementById(chatId);
            elem.style.transition = 'all 0.3s ease';
            elem.style.opacity = '0.4';
            alert('Чат архивирован');
        }

        // Простая поддержка свайпа пальцем на мобильных устройствах
        let touchStartX = 0;
        let activeChatElem = null;

        document.addEventListener('touchstart', e => {
            const item = e.target.closest('.chat-item');
            if (item) {
                touchStartX = e.touches[0].clientX;
                activeChatElem = item;
            }
        });

        document.addEventListener('touchmove', e => {
            if (!activeChatElem) return;
            let currentX = e.touches[0].clientX;
            let diff = touchStartX - currentX;
            if (diff > 50) {
                activeChatElem.style.transform = 'translateX(-160px)'; // Открываем кнопки действий
            } else if (diff < -10) {
                activeChatElem.style.transform = 'translateX(0)'; // Возвращаем назад
            }
        });
    </script>
</body>
</html>
