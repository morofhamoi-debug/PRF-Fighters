<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- ============================================================
       META
       ============================================================ -->
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="color-scheme" content="dark" />
  <meta
    name="description"
    content="Modern House 3D — интерактивная WebGL-сцена дома с физикой, освещением и детальным интерьером."
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>Modern House 3D</title>

  <!-- ============================================================
       PERFORMANCE HINTS
       ============================================================ -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

  <!-- ============================================================
       STYLES  (следующий файл в цепочке: src/ui/styles.css)
       ============================================================ -->
  <link rel="stylesheet" href="./src/ui/styles.css" />

  <!-- ============================================================
       IMPORT MAP
       Единственный inline-скрипт по спецификации — должен быть
       до первого type="module". Пин на версию three.js обязателен.
       ============================================================ -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body data-platform="detecting">

  <!-- ============================================================
       NOSCRIPT FALLBACK
       ============================================================ -->
  <noscript>
    <div class="noscript-overlay">
      <h1>Требуется JavaScript</h1>
      <p>Для запуска 3D-сцены включите JavaScript в настройках браузера.</p>
    </div>
  </noscript>

  <!-- ============================================================
       APP ROOT
       ============================================================ -->
  <main id="app" role="application" aria-label="3D-сцена современного дома">

    <!-- ----------------------------------------------------------
         HUD
         Управляется src/ui/HUD.js — читает ID, обновляет текст
         ---------------------------------------------------------- -->
    <section id="hud" aria-hidden="true">
      <div id="crosshair" role="presentation"></div>

      <div id="hint" role="status">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> движение
        <span class="sep">·</span>
        <kbd>Мышь</kbd> обзор
        <span class="sep">·</span>
        <kbd>Shift</kbd> бег
        <span class="sep">·</span>
        <kbd>Space</kbd> прыжок
        <span class="sep">·</span>
        <kbd>E</kbd> действие
      </div>

      <div id="fps" role="status" aria-live="off">--- FPS</div>

      <div id="interact-prompt" role="status" aria-live="polite"></div>
    </section>

    <!-- ----------------------------------------------------------
         MOBILE CONTROLS
         Показываются на тач-устройствах через body[data-platform="mobile"]
         Управляется src/ui/MobileControls.js
         ---------------------------------------------------------- -->
    <section id="mobile-controls" aria-label="Мобильное управление">
      <div id="look-zone" aria-hidden="true"></div>

      <div id="joystick" aria-label="Джойстик движения" role="group">
        <div id="joy-base"></div>
        <div id="joy-knob"></div>
      </div>

      <button
        type="button"
        class="action-btn"
        id="btn-jump"
        aria-label="Прыжок"
      >↑</button>

      <button
        type="button"
        class="action-btn"
        id="btn-run"
        aria-label="Бег"
        aria-pressed="false"
      >RUN</button>

      <button
        type="button"
        class="action-btn"
        id="btn-use"
        aria-label="Действие"
      >USE</button>
    </section>

    <!-- ----------------------------------------------------------
         START BLOCKER
         Показывается пока не захвачен pointer lock (или пока тап
         на мобиле не скроет его). Управляется src/ui/Blocker.js
         ---------------------------------------------------------- -->
    <section
      id="blocker"
      role="dialog"
      aria-modal="true"
      aria-labelledby="blocker-title"
    >
      <div class="panel">
        <h1 id="blocker-title">MODERN HOUSE</h1>
        <p class="sub">Interactive 3D Experience</p>

        <button type="button" class="play-btn" id="btn-play">Играть</button>

        <div class="controls pc-only">
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> движение
          <span class="sep">·</span>
          <kbd>Shift</kbd> бег
          <span class="sep">·</span>
          <kbd>Space</kbd> прыжок
          <span class="sep">·</span>
          <kbd>E</kbd> действие
          <span class="sep">·</span>
          <kbd>Esc</kbd> пауза
        </div>

        <div class="controls mobile-only">
          Джойстик — движение
          <span class="sep">·</span>
          Свайп справа — обзор
          <span class="sep">·</span>
          Кнопки — действия
        </div>
      </div>
    </section>

    <!-- ----------------------------------------------------------
         LOADING
         Управляется src/ui/Loading.js — setProgress(0..1)
         ---------------------------------------------------------- -->
    <section id="loading" role="status" aria-live="polite">
      <span class="text">ЗАГРУЗКА СЦЕНЫ</span>
      <div class="bar"><div id="loading-bar"></div></div>
      <span class="percent" id="loading-percent">0%</span>
    </section>

    <!-- ----------------------------------------------------------
         TOAST
         Всплывающие уведомления. Управляется src/ui/Toast.js
         ---------------------------------------------------------- -->
    <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  </main>

  <!-- ============================================================
       ENTRY POINT  (следующий файл: src/main.js)
       ============================================================ -->
  <script type="module" src="./src/main.js"></script>

</body>
</html>
