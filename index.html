<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Echo of the Room - Horror</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
        }
        h1 {
            color: #b00;
            text-shadow: 0 0 10px rgba(255,0,0,0.5);
            font-size: 26px;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 2px;
            padding: 0 15px;
        }
        .btn {
            background: #222;
            color: #fff;
            border: 2px solid #500;
            padding: 18px 45px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,0,0,0.3);
            border-radius: 8px;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }
        #action-btn, #exit-hide-btn {
            pointer-events: auto;
            background: rgba(40, 40, 40, 0.9);
            color: white;
            border: 2px solid #888;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            display: none;
            margin-bottom: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        #exit-hide-btn {
            background: rgba(120, 20, 20, 0.9);
            border-color: #f55;
        }
        #instructions {
            color: #777;
            font-size: 13px;
            text-align: center;
            margin-top: 20px;
            max-width: 320px;
            line-height: 1.4;
            padding: 0 15px;
        }
        #story-text {
            color: #fff;
            font-size: 15px;
            text-align: center;
            text-shadow: 0 0 5px #000;
            margin-top: 20px;
        }
    </style>
    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1>THE ECHO OF THE ROOM</h1>
        <button class="btn" id="start-btn">НАЧАТЬ</button>
        <div id="instructions">Левая половина экрана — движение вперед.<br>Правая половина — осмотр комнаты (свайп).<br>Кнопка действия появляется рядом с объектами.</div>
    </div>

    <div id="ui-layer">
        <div id="story-text">Осмотрите комнату...</div>
        <div style="display: flex; flex-direction: column; align-items: center;">
            <button id="exit-hide-btn">ВЫЙТИ ИЗ ШКАФА</button>
            <button id="action-btn">ДЕЙСТВИЕ</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let moveForward = false;
        let pitch = 0, yaw = 0;
        let roomLight, tvScreen;
        let audioCtx;
        
        let gameState = 0; 
        let interactableObjects = [];
        let currentTargetObject = null;
        let isHiding = false;

        let leftTouchId = null;
        let rightTouchId = null;
        let prevTouchX = 0, prevTouchY = 0;

        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('start-btn');
            const actionBtn = document.getElementById('action-btn');
            const exitHideBtn = document.getElementById('exit-hide-btn');

            startBtn.addEventListener('touchend', (e) => { e.preventDefault(); startGame(); });
            startBtn.addEventListener('click', (e) => { e.preventDefault(); startGame(); });

            actionBtn.addEventListener('touchend', (e) => { e.preventDefault(); triggerAction(); });
            actionBtn.addEventListener('click', (e) => { e.preventDefault(); triggerAction(); });

            exitHideBtn.addEventListener('touchend', (e) => { e.preventDefault(); exitHiding(); });
            exitHideBtn.addEventListener('click', (e) => { e.preventDefault(); exitHiding(); });
        });

        function startGame() {
            const startScreen = document.getElementById('start-screen');
            if (startScreen) startScreen.style.display = 'none';

            initAudio();
            init3D();
            setupControls();
            startStorySequence();
        }

        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        }

        function playSound(type) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'switch') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.05);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'static') {
                let bufferSize = audioCtx.sampleRate * 2;
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                let whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = buffer;
                whiteNoise.loop = true;
                whiteNoise.connect(gain);
                gain.gain.setValueAtTime(0.05, now);
                whiteNoise.start(now);
                setTimeout(() => whiteNoise.stop(), 3000);
            } else if (type === 'scary') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.linearRampToValueAtTime(300, now + 4);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.4, now + 4);
                osc.start(now);
                osc.stop(now + 4);
            }
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x151518);
            scene.fog = new THREE.FogExp2(0x151518, 0.04);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 2);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            roomLight = new THREE.PointLight(0xfff5e6, 1.0, 12);
            roomLight.position.set(0, 3.5, 0);
            scene.add(roomLight);

            const textureLoader = new THREE.TextureLoader();
            
            // Текстура пола (ламинат) из image_8.png
            const floorTexture = textureLoader.load('image_8.png');
            floorTexture.wrapS = THREE.RepeatWrapping;
            floorTexture.wrapT = THREE.RepeatWrapping;
            floorTexture.repeat.set(3, 3);
            const floorMat = new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.5 });

            // Стены: сплошной серый цвет
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x888890, roughness: 0.8 });

            // Белый потолок
            const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.9 });

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), ceilingMat);
            ceiling.position.set(0, 5, 0);
            ceiling.rotation.x = Math.PI / 2;
            scene.add(ceiling);

            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 5), wallMat);
            backWall.position.set(0, 2.5, -4);
            scene.add(backWall);

            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 5), wallMat);
            leftWall.position.set(-4, 2.5, 0);
            leftWall.rotation.y = Math.PI / 2;
            scene.add(leftWall);

            // --- ТЕЛЕВИЗОР И ТУМБА ---
            const tvStandMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.3 });
            const tvStand = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.5, 0.6), tvStandMat);
            tvStand.position.set(1.2, 0.25, -3.6);
            scene.add(tvStand);

            const tvGroup = new THREE.Group();
            const tvBody = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.8, 0.05), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            tvBody.position.set(0, 0.4, 0);
            tvGroup.add(tvBody);

            const tvScreenMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
            tvScreen = new THREE.Mesh(new THREE.BoxGeometry(1.34, 0.74, 0.01), tvScreenMat);
            tvScreen.position.set(0, 0.4, 0.03);
            tvGroup.add(tvScreen);

            const legMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const legLeft = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 0.2), legMat);
            legLeft.position.set(-0.5, -0.05, 0);
            legLeft.rotation.x = 0.3;
            tvGroup.add(legLeft);
            const legRight = legLeft.clone();
            legRight.position.x = 0.5;
            tvGroup.add(legRight);

            tvGroup.position.set(1.2, 0.5, -3.6);
            scene.add(tvGroup);
            registerInteractable(tvScreen, "Телевизор", () => {});

            // --- ШКАФ ---
            const closetGroup = new THREE.Group();
            const woodMat = new THREE.MeshStandardMaterial({ color: 0xc8b195, roughness: 0.6 });
            
            const closetBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.6, 0.8), woodMat);
            closetBody.position.set(0, 1.3, 0);
            closetGroup.add(closetBody);

            const handleMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 });
            const handle1 = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3), handleMat);
            handle1.position.set(-0.1, 1.4, 0.41);
            closetGroup.add(handle1);
            const handle2 = handle1.clone();
            handle2.position.x = 0.1;
            closetGroup.add(handle2);

            closetGroup.position.set(-1.5, 0, -3.6);
            scene.add(closetGroup);
            
            registerInteractable(closetBody, "Шкаф (Спрятаться)", () => {
                if (gameState === 4 && !isHiding) {
                    isHiding = true;
                    camera.position.set(-1.5, 1.6, -3.2);
                    document.getElementById('story-text').innerText = "Вы в шкафу. Тихо...";
                    document.getElementById('exit-hide-btn').style.display = 'block';
                    
                    setTimeout(() => {
                        gameState = 5;
                        document.getElementById('story-text').innerText = "Найдите электрический счетчик на стене!";
                    }, 4000);
                }
            });

            // Выключатель
            const sw = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.2), new THREE.MeshBasicMaterial({ color: 0xdddddd }));
            sw.position.set(-3.95, 1.4, -1);
            scene.add(sw);
            registerInteractable(sw, "Выключатель света", () => {
                if (gameState < 3) {
                    roomLight.visible = !roomLight.visible;
                    playSound('switch');
                }
            });

            // Электрический счетчик
            const fuseBox = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0x666666 }));
            fuseBox.position.set(-3.95, 1.5, 1.5);
            scene.add(fuseBox);
            registerInteractable(fuseBox, "Электрический счетчик", () => {
                if (gameState === 5) {
                    roomLight.visible = true;
                    roomLight.intensity = 1.0;
                    playSound('switch');
                    gameState = 6;
                    document.getElementById('story-text').innerText = "Свет включен! Вы победили.";
                    document.getElementById('action-btn').style.display = 'none';
                    document.getElementById('exit-hide-btn').style.display = 'none';
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        function exitHiding() {
            if (isHiding) {
                isHiding = false;
                camera.position.set(0, 1.6, 2);
                document.getElementById('story-text').innerText = "Вы вышли из шкафа.";
                document.getElementById('exit-hide-btn').style.display = 'none';
            }
        }

        function registerInteractable(mesh, name, action) {
            interactableObjects.push({ mesh, name, action });
        }

        function setupControls() {
            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.clientX < window.innerWidth / 2) {
                        if (leftTouchId === null) {
                            leftTouchId = touch.identifier;
                            moveForward = true;
                        }
                    } else {
                        if (rightTouchId === null) {
                            rightTouchId = touch.identifier;
                            prevTouchX = touch.clientX;
                            prevTouchY = touch.clientY;
                        }
                    }
                }
            });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === rightTouchId) {
                        let deltaX = touch.clientX - prevTouchX;
                        let deltaY = touch.clientY - prevTouchY;
                        yaw -= deltaX * 0.005;
                        pitch -= deltaY * 0.005;
                        pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
                        prevTouchX = touch.clientX;
                        prevTouchY = touch.clientY;
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === leftTouchId) {
                        leftTouchId = null;
                        moveForward = false;
                    }
                    if (touch.identifier === rightTouchId) {
                        rightTouchId = null;
                    }
                }
            });

            window.addEventListener('touchcancel', (e) => {
                leftTouchId = null;
                rightTouchId = null;
                moveForward = false;
            });
        }

        function startStorySequence() {
            setTimeout(() => {
                gameState = 1;
                document.getElementById('story-text').innerText = "...";
                let flickers = 0;
                let interval = setInterval(() => {
                    roomLight.visible = !roomLight.visible;
                    playSound('switch');
                    flickers++;
                    if (flickers > 6) {
                        roomLight.visible = true;
                        clearInterval(interval);
                        
                        setTimeout(() => {
                            document.getElementById('story-text').innerText = "Вам показалось, что кто-то позади...";
                            
                            setTimeout(() => {
                                gameState = 2;
                                tvScreen.material.color.setHex(0x336699);
                                playSound('static');
                                document.getElementById('story-text').innerText = "Телевизор включился сам...";
                                
                                setTimeout(() => {
                                    gameState = 3;
                                    playSound('scary');
                                    roomLight.visible = false;
                                    document.getElementById('story-text').innerText = "Свет погас! Срочно спрячьтесь в шкаф!";
                                    gameState = 4;
                                }, 5000);
                            }, 4000);
                        }, 3000);
                    }
                }, 400);
            }, 5000);
        }

        function checkRaycast() {
            if (isHiding) return;
            
            let raycaster = new THREE.Raycaster();
            let dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            raycaster.set(camera.position, dir);

            let meshes = interactableObjects.map(o => o.mesh);
            let intersects = raycaster.intersectObjects(meshes);

            let actionBtn = document.getElementById('action-btn');
            if (intersects.length > 0 && intersects[0].distance < 3.5) {
                let obj = interactableObjects.find(o => o.mesh === intersects[0].object);
                if (obj) {
                    currentTargetObject = obj;
                    actionBtn.style.display = 'block';
                    actionBtn.innerText = obj.name;
                    return;
                }
            }
            currentTargetObject = null;
            if(gameState !== 6) actionBtn.style.display = 'none';
        }

        function triggerAction() {
            if (currentTargetObject) {
                currentTargetObject.action();
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (moveForward && !isHiding) {
                let dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0;
                dir.normalize();
                camera.position.addScaledVector(dir, 0.03);
                camera.position.x = Math.max(-3.5, Math.min(3.5, camera.position.x));
                camera.position.z = Math.max(-3.5, Math.min(3.5, camera.position.z));
            }

            let euler = new THREE.Euler(0, 0, 0, 'YXZ');
            euler.x = pitch;
            euler.y = yaw;
            camera.quaternion.setFromEuler(euler);

            checkRaycast();

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
