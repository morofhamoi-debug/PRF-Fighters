<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>The Shift: Cellar - Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; color: #fff; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 100; pointer-events: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #msg { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 18px; color: #ff3333; }
    </style>
</head>
<body>
    <div id="ui">
        <div>Батарея фонарика: <span id="battery">100</span>%</div>
        <div>Инвентарь: <span id="item">Пусто</span></div>
        <div>Шум: <span id="noise">0</span> дБ</div>
    </div>
    <div id="crosshair"></div>
    <div id="msg">Нажмите LKM для старта (W,A,S,D - ходьба, F - фонарик, E - действие)</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- ИНИЦИАЛИЗА СЦЕНЫ И КАМЕРЫ ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.15);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- ОСВЕЩЕНИЕ ---
        const ambientLight = new THREE.AmbientLight(0x050505);
        scene.add(ambientLight);

        const flashLight = new THREE.SpotLight(0xffffff, 5, 12, Math.PI / 6, 0.5);
        camera.add(flashLight);
        flashLight.position.set(0, 0, 1);
        flashLight.target = camera;
        scene.add(camera);

        // --- ИГРОВЫЕ ПЕРЕМЕННЫЕ ---
        let battery = 100;
        let flashlightOn = true;
        let inventory = null;
        let currentNoise = 0;
        let isGameOver = false;

        // Позиция игрока
        camera.position.set(0, 1.6, 8);

        // --- ПОДВАЛ (МЕШИ) ---
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
        
        // Пол
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Стена с люком
        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), wallMat);
        backWall.position.set(0, 5, -10);
        scene.add(backWall);

        // Предмет: Домкрат
        const jackGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
        const jackMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
        const jackItem = new THREE.Mesh(jackGeo, jackMat);
        jackItem.position.set(-3, 0.2, 0);
        jackItem.name = "jack";
        scene.add(jackItem);

        // Объект: Люк побега
        const hatchGeo = new THREE.BoxGeometry(1.5, 1.5, 0.1);
        const hatchMat = new THREE.MeshStandardMaterial({ color: 0x552200 });
        const hatch = new THREE.Mesh(hatchGeo, hatchMat);
        hatch.position.set(0, 1, -9.9);
        hatch.name = "hatch";
        scene.add(hatch);

        // --- ВРАГ (БАБУШКА) ---
        const grannyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.8);
        const grannyMat = new THREE.MeshStandardMaterial({ color: 0x880000 });
        const granny = new THREE.Mesh(grannyGeo, grannyMat);
        granny.position.set(0, 0.9, -8);
        scene.add(granny);

        // --- УПРАВЛЕНИЕ ---
        const keys = {};
        let yaw = 0, pitch = 0;

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyF') {
                flashlightOn = !flashlightOn;
                flashLight.visible = flashlightOn && battery > 0;
            }
            if (e.code === 'KeyE') interact();
        });
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        document.body.addEventListener('click', () => document.body.requestPointerLock());
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });

        // --- ВЗАИМОДЕЙСТВИЕ ---
        function interact() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(), camera);
            const intersects = raycaster.intersectObjects(scene.children);

            if (intersects.length > 0 && intersects[0].distance < 3) {
                const obj = intersects[0].object;
                
                if (obj.name === "jack") {
                    inventory = "Домкрат";
                    document.getElementById('item').innerText = inventory;
                    scene.remove(obj);
                    document.getElementById('msg').innerText = "Вы подняли домкрат!";
                } 
                else if (obj.name === "hatch") {
                    if (inventory === "Домкрат") {
                        currentNoise = 80; // Скрип домкрата привлекает ИИ
                        document.getElementById('msg').innerText = "Вы ломаете люк! ГРОХОТ!";
                        setTimeout(() => {
                            if (!isGameOver) {
                                alert("ВЫ СБЕЖАЛИ ИЗ ПОДВАЛА!");
                                location.reload();
                            }
                        }, 2000);
                    } else {
                        document.getElementById('msg').innerText = "Люк заклинило. Нужен домкрат!";
                    }
                }
            }
        }

        // --- ИГРОВОЙ ЦИКЛ ---
        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            // Движение игрока
            const speed = 0.05;
            let moving = false;
            if (keys['KeyW']) { camera.translateZ(-speed); moving = true; }
            if (keys['KeyS']) { camera.translateZ(speed); moving = true; }
            if (keys['KeyA']) { camera.translateX(-speed); moving = true; }
            if (keys['KeyD']) { camera.translateX(speed); moving = true; }
            camera.position.y = 1.6; // Ограничение по высоте

            // Расчет шума
            if (moving) {
                currentNoise = Math.min(currentNoise + 2, 40); // Шум шагов
            } else {
                currentNoise = Math.max(0, currentNoise - 1);
            }
            document.getElementById('noise').innerText = currentNoise;

            // Разрядка батареи
            if (flashlightOn && battery > 0) {
                battery -= 0.02;
                document.getElementById('battery').innerText = Math.max(0, Math.floor(battery));
                if (battery <= 0) flashLight.visible = false;
            }

            // ИИ Бабушки (Реакция на шум)
            if (currentNoise > 30) {
                // Движение к игроку
                granny.position.x += (camera.position.x - granny.position.x) * 0.01;
                granny.position.z += (camera.position.z - granny.position.z) * 0.01;
            }

            // Проверка поимки
            if (granny.position.distanceTo(camera.position) < 1.2) {
                isGameOver = true;
                document.getElementById('msg').innerText = "БАБУШКА ВАС ПОЙМАЛА! КОНЕЦ ИГРЫ.";
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
