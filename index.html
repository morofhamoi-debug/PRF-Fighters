<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Shift: Realistic Edition</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #223344;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, rgba(40, 55, 75, 0.95) 0%, rgba(10, 15, 20, 0.99) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.8s ease, visibility 0.8s ease;
            padding: 20px;
            text-align: center;
        }

        #start-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .game-title {
            font-size: clamp(32px, 8vw, 56px);
            font-weight: 900;
            letter-spacing: 4px;
            color: #ff4444;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            margin-bottom: 10px;
        }

        .story-card {
            max-width: 480px;
            background: rgba(255, 255, 255, 0.08);
            border-left: 3px solid #ff4444;
            padding: 15px 20px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
            color: #ddd;
            margin-bottom: 20px;
            text-align: left;
        }

        .settings-group {
            margin-bottom: 25px;
            width: 100%;
            max-width: 300px;
            text-align: left;
            font-size: 13px;
            color: #ccc;
        }

        .settings-group label {
            display: block;
            margin-bottom: 5px;
        }

        .settings-group input[type="range"] {
            width: 100%;
            accent-color: #ff4444;
        }

        .btn-start {
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            background: linear-gradient(135deg, #cc2222 0%, #770000 100%);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
            outline: none;
        }

        #blackout {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            opacity: 0;
            z-index: 150;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
            pointer-events: none;
            font-size: 13px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            display: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 90;
            display: none;
        }
        #msg {
            position: absolute;
            top: 70px;
            width: 100%;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            color: #ff7777;
            text-shadow: 1px 1px 4px #000;
            pointer-events: none;
            z-index: 100;
            padding: 0 10px;
            display: none;
        }
        
        .mobile-btn {
            position: absolute;
            z-index: 120;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            backdrop-filter: blur(4px);
        }
        #btn-action { right: 25px; bottom: 110px; }
        #btn-light { right: 100px; bottom: 35px; }

        #joystick-zone {
            position: absolute;
            left: 25px;
            bottom: 35px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: 120;
            display: none;
        }
        #joystick-stick {
            position: absolute;
            left: 35px;
            top: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }

        #touch-look-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            z-index: 80;
            display: none;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 class="game-title">The Shift</h1>
        <div class="story-card">
            Вечерний вызов. Вы за рулем своей ВАЗ-2107 подъезжаете к дому в лесу. Но как только вы заходите внутрь, дверь захлопывается и вас вырубают...
        </div>
        <div class="settings-group">
            <label for="sensRange">Чувствительность обзора: <span id="sensVal">1.0</span></label>
            <input type="range" id="sensRange" min="0.3" max="2.5" step="0.1" value="1.0">
        </div>
        <button id="start-btn" class="btn-start">НАЧАТЬ ИГРУ</button>
    </div>

    <div id="blackout"></div>

    <div id="ui">
        <div>БАТАРЕЯ: <span id="battery">100</span>%</div>
        <div>ИНВЕНТАРЬ: <span id="item">Пусто</span></div>
        <div>ЭТАЖ: <span id="floor-name">Подвал</span></div>
    </div>
    <div id="crosshair"></div>
    <div id="msg">Осмотритесь вокруг и найдите выход из подвала...</div>

    <div id="touch-look-zone"></div>
    <div id="btn-action" class="mobile-btn">E</div>
    <div id="btn-light" class="mobile-btn">🔦</div>
    <div id="joystick-zone"><div id="joystick-stick"></div></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        class SoundEngine {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playEngine() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(38, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                return { osc, gain };
            }
            playSlam() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(110, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(75, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.8, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);
            }
            playStep(isBasement) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = isBasement ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(isBasement ? 100 : 80, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(25, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
            playClick() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(700, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.04);
            }
        }

        const sounds = new SoundEngine();

        let cutsceneActive = false;
        let gameStarted = false;
        let battery = 100;
        let flashlightOn = true;
        let inventory = null;
        let sensitivity = 1.0;

        const sensRange = document.getElementById('sensRange');
        const sensVal = document.getElementById('sensVal');
        sensRange.addEventListener('input', (e) => {
            sensitivity = parseFloat(e.target.value);
            sensVal.innerText = sensitivity.toFixed(1);
        });

        // --- ГЕНЕРАТОРЫ ТЕКСТУР ---
        function createWallpaperTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#bfa888';
            ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#9e8565';
            for (let i = 0; i < 512; i += 32) ctx.fillRect(i, 0, 16, 512);
            ctx.fillStyle = 'rgba(0,0,0,0.04)';
            for (let i = 0; i < 800; i++) ctx.fillRect(Math.random() * 512, Math.random() * 512, 3, 3);
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 2);
            return texture;
        }

        function createConcreteTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#8a9094';
            ctx.fillRect(0, 0, 512, 512);

            for (let i = 0; i < 40; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.06)';
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 80 + 20, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let i = 0; i < 1500; i++) {
                let x = Math.random() * 512;
                let y = Math.random() * 512;
                let size = Math.random() * 2 + 1;
                ctx.fillStyle = Math.random() > 0.3 ? 'rgba(40,40,40,0.35)' : 'rgba(200,200,200,0.2)';
                ctx.fillRect(x, y, size, size);
            }

            ctx.strokeStyle = 'rgba(30, 30, 30, 0.25)';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                let cx = Math.random() * 512;
                let cy = Math.random() * 512;
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + (Math.random() - 0.5) * 200, cy + (Math.random() - 0.5) * 200);
                ctx.stroke();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(3, 2);
            return texture;
        }

        function createWoodTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#5c3a21';
            ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#422815';
            for (let i = 0; i < 20; i++) {
                ctx.beginPath();
                ctx.arc(256, 256, i * 25, 0, Math.PI * 2);
                ctx.lineWidth = 8;
                ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a3642);
        scene.fog = new THREE.FogExp2(0x2a3642, 0.035);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const player = new THREE.Group();
        scene.add(player);
        player.add(camera);

        const hemisphereLight = new THREE.HemisphereLight(0xffeedd, 0x334455, 0.7);
        scene.add(hemisphereLight);

        const handGroup = new THREE.Group();
        const handMat = new THREE.MeshStandardMaterial({ color: 0x9c7a63, roughness: 0.8 });
        const flashBodyMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 });

        const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.4), handMat);
        arm.rotation.x = Math.PI / 3;
        arm.position.set(0.25, -0.25, -0.35);

        const flashlightModel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.02, 0.25), flashBodyMat);
        flashlightModel.rotation.x = Math.PI / 2;
        flashlightModel.position.set(0.25, -0.15, -0.45);

        handGroup.add(arm, flashlightModel);
        camera.add(handGroup);

        const flashLight = new THREE.SpotLight(0xfffaed, 22, 22, Math.PI / 5, 0.3, 1);
        flashLight.position.set(0.25, -0.15, -0.45);
        flashLight.target.position.set(0, 0, -2);
        camera.add(flashLight);
        camera.add(flashLight.target);

        const interiorGroup = new THREE.Group();
        const dashMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.7 });
        const steeringMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x88aacc, transparent: true, opacity: 0.3, roughness: 0.1 });

        const dashboard = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.4, 0.6), dashMat);
        dashboard.position.set(0, -0.2, -0.6);
        interiorGroup.add(dashboard);

        const steeringWheel = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.04, 16), steeringMat);
        steeringWheel.rotation.x = Math.PI / 3;
        steeringWheel.position.set(0, -0.05, -0.45);
        interiorGroup.add(steeringWheel);

        const windshield = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.9), glassMat);
        windshield.position.set(0, 0.3, -0.7);
        interiorGroup.add(windshield);

        interiorGroup.position.set(0, 1.4, 0);
        camera.add(interiorGroup);

        const vazGroup = new THREE.Group();
        const vazBodyMat = new THREE.MeshStandardMaterial({ color: 0x1f3c5c, roughness: 0.4, metalness: 0.5 });
        const bodyMain = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.7, 3.8), vazBodyMat);
        bodyMain.position.y = 5.6;
        vazGroup.add(bodyMain);
        vazGroup.position.set(0, 0, 32);
        scene.add(vazGroup);

        const bat = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.05, 0.9), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
        bat.position.set(0, 6.5, 0);
        bat.visible = false;
        scene.add(bat);

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: 0x1a261a, roughness: 0.9 }));
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 4.9;
        scene.add(ground);

        const wallpaperTex = createWallpaperTexture();
        const concreteTex = createConcreteTexture();
        const woodTex = createWoodTexture();

        const wallMat = new THREE.MeshStandardMaterial({ map: wallpaperTex, roughness: 0.8, side: THREE.DoubleSide });
        const concreteMat = new THREE.MeshStandardMaterial({ map: concreteTex, roughness: 0.8, side: THREE.DoubleSide });
        const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.9, side: THREE.DoubleSide });
        const floorMatWood = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.6, side: THREE.DoubleSide });

        function createRealisticRoom(x, y, z, w, h, d, isBasement) {
            const group = new THREE.Group();
            const floorMeshMat = isBasement ? new THREE.MeshStandardMaterial({ color: 0x33383d, roughness: 0.7, side: THREE.DoubleSide }) : floorMatWood;
            const wallMeshMat = isBasement ? concreteMat : wallMat;

            const fl = new THREE.Mesh(new THREE.BoxGeometry(w, 0.2, d), floorMeshMat);
            fl.position.set(x, y, z);
            group.add(fl);

            const ceiling = new THREE.Mesh(new THREE.BoxGeometry(w, 0.2, d), ceilingMat);
            ceiling.position.set(x, y + h, z);
            group.add(ceiling);

            const wl1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, h, d), wallMeshMat);
            wl1.position.set(x - w/2, y + h/2, z);

            const wl2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, h, d), wallMeshMat);
            wl2.position.set(x + w/2, y + h/2, z);

            const wl3 = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.2), wallMeshMat);
            wl3.position.set(x, y + h/2, z - d/2);

            const wl4 = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.2), wallMeshMat);
            wl4.position.set(x, y + h/2, z + d/2);

            group.add(wl1, wl2, wl3, wl4);

            const bulbLight = new THREE.PointLight(isBasement ? 0xff7744 : 0xfffaed, 1.5, 10);
            bulbLight.position.set(x, y + h - 0.4, z);
            group.add(bulbLight);

            return group;
        }

        scene.add(createRealisticRoom(0, 0, 0, 12, 4, 12, true));   // Подвал
        scene.add(createRealisticRoom(0, 5, 0, 12, 4, 12, false));  // 1 этаж
        scene.add(createRealisticRoom(0, 10, 0, 12, 4, 12, false)); // 2 этаж

        // --- ЛЕСТНИЦА ИЗ ПОДВАЛА НА 1 ЭТАЖ ---
        const stairsGroup = new THREE.Group();
        const stairMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.8 });
        for (let i = 0; i < 10; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.2, 0.4), stairMat);
            step.position.set(4.5, 0.2 + i * 0.4, 4.5 - i * 0.35);
            stairsGroup.add(step);
        }
        scene.add(stairsGroup);

        // --- ВХОДНАЯ ДВЕРЬ НА 1 ЭТАЖЕ ---
        const doorGroup = new THREE.Group();
        const doorPanelMat = new THREE.MeshStandardMaterial({ color: 0x4a2414, roughness: 0.5 });
        const doorHandleMat = new THREE.MeshStandardMaterial({ color: 0xddbb44, metalness: 0.8, roughness: 0.2 });

        const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 3.5, 0.25), doorPanelMat);
        doorMesh.name = "exit-door";
        const handle1 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), doorHandleMat);
        handle1.position.set(0.8, 0, 0.15);
        const handle2 = handle1.clone();
        handle2.position.set(0.8, 0, -0.15);

        doorGroup.add(doorMesh, handle1, handle2);
        doorGroup.position.set(0, 6.75, 5.9);
        scene.add(doorGroup);

        // --- ДОМКРАТ STELS ---
        const jackGroup = new THREE.Group();
        const blueBodyMat = new THREE.MeshStandardMaterial({ color: 0x0e5d8a, roughness: 0.3, metalness: 0.6 });
        const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4, metalness: 0.8 });
        const silverMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.2, metalness: 0.9 });
        const rubberMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });

        const baseChassis = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.12, 0.9), blueBodyMat);
        baseChassis.position.set(0, 0.06, 0);

        const liftArm = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.08, 0.7), blueBodyMat);
        liftArm.rotation.x = -0.15;
        liftArm.position.set(0, 0.14, -0.1);

        const padBase = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.04, 16), silverMat);
        padBase.position.set(0, 0.18, -0.35);
        const padRubber = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.03, 16), rubberMat);
        padRubber.position.set(0, 0.21, -0.35);

        const cylinderBlock = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.22, 0.3), blueBodyMat);
        cylinderBlock.position.set(0, 0.15, 0.25);

        const frontWheelGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.05, 16);
        frontWheelGeo.rotateZ(Math.PI / 2);
        const wheelFL = new THREE.Mesh(frontWheelGeo, darkMetalMat);
        wheelFL.position.set(-0.22, 0.04, -0.4);
        const wheelFR = new THREE.Mesh(frontWheelGeo, darkMetalMat);
        wheelFR.position.set(0.22, 0.04, -0.4);

        const rearWheelGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.06, 16);
        rearWheelGeo.rotateZ(Math.PI / 2);
        const wheelRL = new THREE.Mesh(rearWheelGeo, darkMetalMat);
        wheelRL.position.set(-0.25, 0.06, 0.4);
        const wheelRR = new THREE.Mesh(rearWheelGeo, darkMetalMat);
        wheelRR.position.set(0.25, 0.06, 0.4);

        const handleSocket = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.15), silverMat);
        handleSocket.rotation.x = Math.PI / 3;
        handleSocket.position.set(0, 0.22, 0.35);

        const handleRod = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.1), blueBodyMat);
        handleRod.rotation.x = Math.PI / 3.5;
        handleRod.position.set(0, 0.5, 0.65);

        const handleGrip = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.4), darkMetalMat);
        handleGrip.rotation.x = Math.PI / 3.5;
        handleGrip.position.set(0, 0.85, 0.85);

        jackGroup.add(
            baseChassis, liftArm, padBase, padRubber, 
            cylinderBlock, wheelFL, wheelFR, wheelRL, wheelRR, 
            handleSocket, handleRod, handleGrip
        );

        jackGroup.scale.set(1.2, 1.2, 1.2);
        jackGroup.position.set(-4, 0, -4); // Домкрат лежит в подвале
        jackGroup.name = "jack";
        scene.add(jackGroup);

        document.getElementById('start-btn').addEventListener('click', () => {
            sounds.init();
            document.getElementById('start-screen').classList.add('hidden');
            runCutscene();
        });

        function runCutscene() {
            cutsceneActive = true;
            interiorGroup.visible = true;
            const engineSound = sounds.playEngine();
            player.position.set(0, 6.5, 32);

            let progress = 0;
            const driveInterval = setInterval(() => {
                progress += 0.007;
                player.position.z = THREE.MathUtils.lerp(32, 12, progress);
                vazGroup.position.z = player.position.z;

                if (progress >= 1) {
                    clearInterval(driveInterval);
                    if (engineSound) engineSound.osc.stop();
                    
                    setTimeout(() => {
                        interiorGroup.visible = false;
                        let walkProgress = 0;
                        const walkInterval = setInterval(() => {
                            walkProgress += 0.02;
                            player.position.z = THREE.MathUtils.lerp(12, 4, walkProgress);
                            
                            if (walkProgress >= 1) {
                                clearInterval(walkInterval);
                                sounds.playSlam();
                                doorGroup.position.z = 6;
                                
                                setTimeout(() => {
                                    bat.visible = true;
                                    bat.position.set(player.position.x + 0.5, player.position.y + 0.2, player.position.z - 0.5);
                                    
                                    setTimeout(() => {
                                        sounds.playHit();
                                        document.getElementById('blackout').style.opacity = '1';
                                        
                                        setTimeout(() => {
                                            bat.visible = false;
                                            player.position.set(0, 1.6, 0); // Очнулись в подвале
                                            document.getElementById('blackout').style.opacity = '0';
                                            cutsceneActive = false;
                                            gameStarted = true;
                                            enableUI();
                                        }, 1500);
                                    }, 400);
                                }, 600);
                            }
                        }, 40);
                    }, 800);
                }
            }, 30);
        }

        function enableUI() {
            document.getElementById('ui').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('msg').style.display = 'block';
            document.getElementById('btn-action').style.display = 'flex';
            document.getElementById('btn-light').style.display = 'flex';
            document.getElementById('joystick-zone').style.display = 'block';
            document.getElementById('touch-look-zone').style.display = 'block';
        }

        let yaw = 0, pitch = 0;
        let lookTouchId = null;
        let lastTouchX = 0, lastTouchY = 0;

        const lookZone = document.getElementById('touch-look-zone');
        lookZone.addEventListener('touchstart', (e) => {
            if (!gameStarted || cutsceneActive) return;
            for (let t of e.changedTouches) {
                if (lookTouchId === null) {
                    lookTouchId = t.identifier;
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        });

        lookZone.addEventListener('touchmove', (e) => {
            if (!gameStarted || cutsceneActive) return;
            for (let t of e.changedTouches) {
                if (t.identifier === lookTouchId) {
                    let dx = t.clientX - lastTouchX;
                    let dy = t.clientY - lastTouchY;
                    yaw -= dx * 0.004 * sensitivity;
                    pitch -= dy * 0.004 * sensitivity;
                    pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                    player.rotation.y = yaw;
                    camera.rotation.x = pitch;
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        });

        const resetLook = (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === lookTouchId) lookTouchId = null;
            }
        };
        lookZone.addEventListener('touchend', resetLook);
        lookZone.addEventListener('touchcancel', resetLook);

        let moveVector = { x: 0, z: 0 };
        const joyZone = document.getElementById('joystick-zone');
        const joyStick = document.getElementById('joystick-stick');

        joyZone.addEventListener('touchmove', (e) => {
            if (!gameStarted || cutsceneActive) return;
            e.preventDefault();
            const rect = joyZone.getBoundingClientRect();
            const touch = e.touches[0];
            let x = touch.clientX - rect.left - 60;
            let y = touch.clientY - rect.top - 60;
            let dist = Math.hypot(x, y);
            if (dist > 35) { x = (x / dist) * 35; y = (y / dist) * 35; }
            joyStick.style.transform = `translate(${x}px, ${y}px)`;
            moveVector.x = x / 35;
            moveVector.z = y / 35;
        });

        joyZone.addEventListener('touchend', () => {
            joyStick.style.transform = `translate(0px, 0px)`;
            moveVector = { x: 0, z: 0 };
        });

        document.getElementById('btn-light').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameStarted) {
                sounds.playClick();
                flashlightOn = !flashlightOn;
                flashLight.visible = flashlightOn && battery > 0;
                handGroup.visible = flashlightOn;
            }
        });

        document.getElementById('btn-action').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!gameStarted) return;
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(), camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0 && intersects[0].distance < 3.5) {
                let obj = intersects[0].object;
                let rootObj = obj;
                while (rootObj.parent && rootObj.parent !== scene) {
                    rootObj = rootObj.parent;
                }
                
                if (rootObj.name === "jack") {
                    inventory = "Домкрат Stels";
                    document.getElementById('item').innerText = inventory;
                    scene.remove(rootObj);
                    document.getElementById('msg').innerText = "Вы подобрали гидравлический домкрат!";
                } else if (obj.name === "exit-door" || rootObj.children.includes(doorMesh)) {
                    document.getElementById('msg').innerText = "Дверь заперта снаружи! Нужен инструмент.";
                }
            }
        });

        let walkTimer = 0;
        let stepTimer = 0;

        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted && !cutsceneActive) {
                const speed = 0.05;
                if (moveVector.x !== 0 || moveVector.z !== 0) {
                    const dir = new THREE.Vector3(moveVector.x, 0, moveVector.z).normalize();
                    dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
                    player.position.addScaledVector(dir, speed);

                    walkTimer += 0.15;
                    stepTimer += 0.05;
                    handGroup.position.y = Math.sin(walkTimer) * 0.02;
                    handGroup.position.x = Math.cos(walkTimer * 0.5) * 0.01;

                    if (stepTimer >= 0.4) {
                        stepTimer = 0;
                        sounds.playStep(player.position.y < 3);
                    }
                }

                // Плавный подъём по лестнице в правом углу подвала (возле x: 4.5, z: 4.5)
                let targetFloorY = 1.6;
                if (player.position.x > 3.5 && player.position.x < 5.5 && player.position.z > -2 && player.position.z < 5.5) {
                    // Рассчитываем высоту подъема по лестнице
                    let stairProgress = THREE.MathUtils.clamp((5.5 - player.position.z) / 7.5, 0, 1);
                    targetFloorY = 1.6 + stairProgress * 5.0;
                } else if (player.position.y > 4.5) {
                    targetFloorY = 6.6; // 1 этаж
                }
                player.position.y = THREE.MathUtils.lerp(player.position.y, targetFloorY, 0.1);

                player.position.x = Math.max(-5.5, Math.min(5.5, player.position.x));
                player.position.z = Math.max(-5.5, Math.min(5.5, player.position.z));

                if (player.position.y < 3) document.getElementById('floor-name').innerText = "Подвал";
                else if (player.position.y < 8) document.getElementById('floor-name').innerText = "1 Этаж";
                else document.getElementById('floor-name').innerText = "2 Этаж";

                if (flashlightOn && battery > 0) {
                    battery -= 0.005;
                    document.getElementById('battery').innerText = Math.max(0, Math.floor(battery));
                    if (battery <= 0) {
                        flashLight.visible = false;
                        handGroup.visible = false;
                    }
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
